<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Ledger</title>

<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#08090c">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090c;
  --panel:#0d0f13;
  --ink:#E7E9ED;
  --muted:#6E757B;
  --dim:#464C53;
  --gold:#BBA37D;
  --rule:rgba(187,163,125,0.28);
  --hair:rgba(231,233,237,0.07);

  --col:34rem;
  --gut:1.4rem;
}
html,body{height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Jost',system-ui,-apple-system,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

.wrap{
  width:100%;
  max-width:var(--col);
  margin:0 auto;
  padding-left:var(--gut);
  padding-right:var(--gut);
}

/* ---------- masthead ---------- */
header{flex-shrink:0;padding-top:1.7rem;padding-bottom:1.1rem}
header .wrap{display:flex;align-items:center;gap:1rem}
header svg.seal{width:32px;height:32px;flex-shrink:0}
.brand{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:500;text-transform:uppercase;
  letter-spacing:0.3em;font-size:1.28rem;line-height:1;
  padding-left:0.3em;
}
.count{
  margin-left:auto;
  font-size:0.64rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--dim);font-variant-numeric:tabular-nums;
  padding-right:0.8rem;
}
.menu{
  background:none;border:none;color:var(--dim);cursor:pointer;
  padding:0.4rem 0.15rem;display:flex;flex-direction:column;gap:3.5px;
  transition:color .3s ease;
}
.menu span{display:block;width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.menu:active,.menu:hover{color:var(--gold)}

/* ---------- tabs ---------- */
nav{flex-shrink:0;border-bottom:1px solid var(--hair)}
nav .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;
  font-family:'Jost',sans-serif;font-weight:300;
  color:var(--dim);text-transform:uppercase;letter-spacing:0.2em;
  font-size:0.72rem;padding:1.05rem 0 0.9rem;margin-right:1.9rem;
  white-space:nowrap;position:relative;cursor:pointer;
  transition:color .35s ease;
}
.tab:last-child{margin-right:0}
.tab::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;
  transition:transform .4s cubic-bezier(.2,.7,.2,1);
}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}
.tab:hover{color:var(--muted)}
.tab.on:hover{color:var(--ink)}
.tab .n{
  font-size:0.56rem;color:var(--dim);margin-left:0.5em;
  letter-spacing:0.1em;font-variant-numeric:tabular-nums;
}
.tab.on .n{color:var(--gold)}

/* ---------- list ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:9rem}
main > .wrap{padding-left:0;padding-right:0}
.item{
  display:flex;align-items:flex-start;gap:0.95rem;
  padding:0.95rem var(--gut);
  border-bottom:1px solid var(--hair);
  animation:in .45s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.box{
  width:15px;height:15px;margin-top:3px;flex-shrink:0;
  border:1px solid var(--rule);border-radius:1px;
  background:none;cursor:pointer;position:relative;
  transition:border-color .3s ease;
}
.box::after{
  content:'';position:absolute;inset:2px;background:var(--gold);
  transform:scale(0);transition:transform .28s cubic-bezier(.3,1.4,.5,1);
}
.item.done .box{border-color:rgba(187,163,125,0.5)}
.item.done .box::after{transform:scale(1)}

/* tapping the body opens detail */
.body{
  flex:1;min-width:0;cursor:pointer;
  display:flex;align-items:flex-start;gap:0.7rem;
}
.txt{
  flex:1;font-size:0.94rem;font-weight:300;line-height:1.45;
  letter-spacing:0.012em;color:var(--ink);word-break:break-word;
  transition:color .35s ease;
}
.item.done .txt{  color:var(--dim);text-decoration:line-through;
  text-decoration-color:var(--rule);text-decoration-thickness:1px;
}
/* meta marker: notes / sub-item progress */
.meta{
  flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;gap:0.5rem;
  font-size:0.6rem;letter-spacing:0.08em;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.meta .dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--gold);opacity:0.7;
}
.meta .frac{color:var(--muted)}
.meta .wtag{
  text-transform:uppercase;letter-spacing:0.16em;
  font-size:0.52rem;color:var(--gold);opacity:0.75;
}
.chev{
  flex-shrink:0;margin-top:5px;width:6px;height:10px;opacity:0.35;
  transition:opacity .3s ease;
}
.body:hover .chev{opacity:0.7}

/* ---------- waiting state: present but receded ---------- */
.item.waiting{opacity:0.52}
.item.waiting .txt{color:var(--muted);font-style:italic}
.item.waiting .box{
  border-color:var(--hair);
  border-style:dashed;
}
.item.waiting:hover{opacity:0.78}
.item.waiting .chev{opacity:0.2}

/* divider introducing the waiting group */
.tierrule{
  display:flex;align-items:center;gap:0.9rem;
  padding:1.5rem var(--gut) 0.55rem;
}
.tierrule::after{
  content:'';flex:1;height:1px;background:var(--hair);
}
.tierrule span{
  font-family:'Jost',sans-serif;font-weight:300;
  text-transform:uppercase;letter-spacing:0.22em;
  font-size:0.55rem;color:var(--dim);white-space:nowrap;
}

/* ---------- empty ---------- */
.empty{padding:4.5rem 2.6rem;text-align:center;animation:in .5s ease both}
.empty .line{width:38px;height:1px;background:var(--rule);margin:0 auto 1.7rem}
.empty p{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.12rem;color:var(--muted);letter-spacing:0.04em;line-height:1.6;
}
.empty span{
  display:block;margin-top:0.9rem;font-family:'Jost',sans-serif;
  font-size:0.6rem;text-transform:uppercase;letter-spacing:0.24em;color:var(--dim);
}

/* ---------- compose ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;
  padding-top:0.9rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,rgba(8,9,12,0));
}
footer .wrap{display:flex;align-items:center;gap:0.9rem}
.compose{
  flex:1;display:flex;align-items:center;gap:0.85rem;
  border-bottom:1px solid var(--rule);padding-bottom:0.55rem;
  transition:border-color .4s ease;
}
.compose:focus-within{border-color:var(--gold)}
.wedge{width:7px;height:13px;flex-shrink:0;opacity:0.75}
input[type=text]{
  flex:1;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);
  font-size:16px;letter-spacing:0.012em;padding:0;
}
input[type=text]::placeholder{color:var(--dim);letter-spacing:0.05em;font-size:0.94rem}
.add{
  background:none;border:1px solid var(--rule);color:var(--gold);
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  font-size:1.1rem;line-height:1;font-family:'Jost',sans-serif;font-weight:300;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;opacity:0.4;
  transition:background .3s ease,border-color .3s ease,opacity .3s ease;
}
.add.live{opacity:1;border-color:var(--gold)}
.add:active,.add:hover{background:rgba(187,163,125,0.14)}

/* ---------- sweep ---------- */
.sweep{
  display:block;margin:1.9rem auto 0;background:none;border:none;
  color:var(--dim);font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.58rem;text-transform:uppercase;letter-spacing:0.24em;
  cursor:pointer;padding:0.6rem 1rem;transition:color .35s ease;
}
.sweep:active,.sweep:hover{color:var(--gold)}

/* ---------- scrim (shared by sheet + detail) ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,0.62);
  opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40;
}
.scrim.up{opacity:1;pointer-events:auto}

/* ---------- backup sheet ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--rule);
  padding-top:1.7rem;padding-bottom:calc(1.6rem + env(safe-area-inset-bottom));
  transform:translateY(101%);
  transition:transform .42s cubic-bezier(.2,.7,.2,1);
}
.sheet.up{transform:translateY(0)}
.sheet h2{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  text-transform:uppercase;letter-spacing:0.26em;font-size:0.8rem;
  color:var(--muted);padding-left:0.26em;margin-bottom:1.4rem;
}
.act{
  display:block;width:100%;text-align:left;background:none;border:none;
  border-top:1px solid var(--hair);color:var(--ink);
  font-family:'Jost',sans-serif;font-weight:300;font-size:0.88rem;
  letter-spacing:0.06em;padding:1.05rem 0.1rem;cursor:pointer;
  transition:color .3s ease;
}
.act:active,.act:hover{color:var(--gold)}
.act small{
  display:block;color:var(--dim);font-size:0.66rem;
  letter-spacing:0.1em;margin-top:0.3rem;
}
.stamp{
  margin-top:1.5rem;text-align:center;font-size:0.55rem;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);
}
#file{display:none}

/* sync status line at top of sheet */
.synced{
  font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--dim);padding-bottom:1rem;
  display:flex;align-items:center;gap:0.55rem;
}
.synced .led{
  width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0;
}
.synced.on .led{background:var(--gold);box-shadow:0 0 6px rgba(187,163,125,0.6)}
.synced.busy .led{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.synced.err .led{background:#B4776B}
.synced.warn .led{background:#C9A96A;box-shadow:0 0 6px rgba(201,169,106,0.7)}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* sync setup form */
#syncSheet{z-index:55}
#tabSheet{z-index:56}

/* manage lists */
.tablist{display:flex;flex-direction:column;margin-bottom:0.4rem}
.tabrow{
  display:flex;align-items:center;gap:0.8rem;
  padding:0.75rem 0;border-top:1px solid var(--hair);
}
.tabrow:last-child{border-bottom:1px solid var(--hair)}
.tabrow input{
  flex:1;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);
  font-size:16px;letter-spacing:0.03em;padding:0.1rem 0;
  border-bottom:1px solid transparent;
  transition:border-color .3s ease;
}
.tabrow input:focus{border-bottom-color:var(--rule)}
.tabrow .cnt{
  font-size:0.58rem;letter-spacing:0.14em;color:var(--dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tabbtn{
  background:none;border:none;color:var(--dim);cursor:pointer;
  padding:0.25rem 0.3rem;font-size:0.95rem;line-height:1;
  font-family:'Jost',sans-serif;font-weight:300;
  transition:color .3s ease;
}
.tabbtn:hover,.tabbtn:active{color:var(--gold)}
.tabbtn.rm:hover,.tabbtn.rm:active{color:#C08A7E}
.tabbtn[disabled]{opacity:0.22;cursor:default}
.tabbtn[disabled]:hover{color:var(--dim)}
.syncform{display:flex;flex-direction:column}
.synclabel{
  font-family:'Jost',sans-serif;font-weight:400;
  text-transform:uppercase;letter-spacing:0.2em;font-size:0.58rem;
  color:var(--dim);margin:1rem 0 0.5rem;
}
.syncinput{
  background:none;border:none;border-bottom:1px solid var(--rule);
  outline:none;color:var(--ink);
  font-family:'Jost',sans-serif;font-weight:300;font-size:16px;
  letter-spacing:0.02em;padding:0.3rem 0 0.55rem;
  transition:border-color .3s ease;
}
.syncinput:focus{border-color:var(--gold)}
.syncinput::placeholder{color:var(--dim)}
.syncmsg{
  min-height:1.1rem;margin:1rem 0 0.2rem;
  font-size:0.64rem;letter-spacing:0.06em;color:var(--muted);line-height:1.5;
}
.syncmsg.err{color:#C08A7E}
.syncmsg.ok{color:var(--gold)}

/* ---------- detail view ---------- */
.detail{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(.2,.7,.2,1);
  visibility:hidden;
}
.detail.up{transform:translateX(0);visibility:visible}

.dhead{flex-shrink:0;padding-top:1.4rem;padding-bottom:1.1rem}
.dhead .wrap{display:flex;align-items:center;gap:0.4rem}
.back{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-family:'Jost',sans-serif;font-weight:300;font-size:0.7rem;
  text-transform:uppercase;letter-spacing:0.2em;
  display:flex;align-items:center;gap:0.6rem;
  padding:0.3rem 0.2rem 0.3rem 0;
  transition:color .3s ease;
}
.back:active,.back:hover{color:var(--gold)}
.back svg{width:7px;height:12px}
.dtabname{
  margin-left:auto;font-size:0.6rem;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);
}

.dbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:2.5rem}

/* title row */
.dtitle{
  display:flex;align-items:flex-start;gap:0.95rem;
  padding:0.4rem var(--gut) 1.4rem;
  border-bottom:1px solid var(--hair);
}
.dtitle .box{width:17px;height:17px;margin-top:4px}
.dtitle-txt{
  flex:1;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.5rem;line-height:1.28;color:var(--ink);
  letter-spacing:0.01em;
  background:none;border:none;outline:none;resize:none;
  overflow:hidden;font-weight:500;
  width:100%;
}
.detail.done-item .dtitle-txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}

/* section label */
.dlabel{
  font-family:'Jost',sans-serif;font-weight:400;
  text-transform:uppercase;letter-spacing:0.24em;
  font-size:0.6rem;color:var(--dim);
  padding:1.8rem var(--gut) 0.9rem;
}

/* notes */
.notes{
  width:100%;background:none;border:none;outline:none;resize:none;
  font-family:'Jost',sans-serif;font-weight:300;
  color:var(--ink);font-size:0.95rem;line-height:1.6;
  letter-spacing:0.01em;padding:0 var(--gut);
  min-height:4.5rem;overflow:hidden;
}
.notes::placeholder{color:var(--dim)}

/* sub-items */
.sub{
  display:flex;align-items:flex-start;gap:0.9rem;
  padding:0.7rem var(--gut);
  border-bottom:1px solid var(--hair);
}
.sub:first-of-type{border-top:1px solid var(--hair)}
.subbox{
  width:14px;height:14px;margin-top:2px;flex-shrink:0;
  border:1px solid var(--rule);border-radius:1px;
  background:none;cursor:pointer;position:relative;
  transition:border-color .3s ease;
}
.subbox::after{
  content:'';position:absolute;inset:2px;background:var(--gold);
  transform:scale(0);transition:transform .28s cubic-bezier(.3,1.4,.5,1);
}
.sub.done .subbox{border-color:rgba(187,163,125,0.5)}
.sub.done .subbox::after{transform:scale(1)}
.sub-txt{
  flex:1;font-size:0.9rem;line-height:1.4;color:var(--ink);
  word-break:break-word;letter-spacing:0.012em;
}
.sub.done .sub-txt{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--rule)}
.sub-del{
  background:none;border:none;color:var(--dim);
  font-size:1rem;line-height:1;padding:0.1rem 0.2rem;cursor:pointer;
  transition:color .3s ease;
}
.sub-del:active,.sub-del:hover{color:var(--gold)}

.subadd{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.9rem var(--gut) 0;
}
.subadd .plus{
  width:14px;height:14px;flex-shrink:0;position:relative;opacity:0.6;
}
.subadd .plus::before,.subadd .plus::after{
  content:'';position:absolute;background:var(--gold);
}
.subadd .plus::before{left:6px;top:1px;width:1px;height:12px}
.subadd .plus::after{top:6px;left:1px;height:1px;width:12px}
.subadd input{
  flex:1;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);
  font-size:16px;letter-spacing:0.012em;padding:0;
}
.subadd input::placeholder{color:var(--dim);font-size:0.9rem}

.dtools{padding:2.4rem var(--gut) 0;display:flex;flex-direction:column;align-items:flex-start;gap:0.2rem}
.dtools button{
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.58rem;text-transform:uppercase;letter-spacing:0.22em;
  padding:0.5rem 0;transition:color .3s ease;
}
.dtools button:active,.dtools button:hover{color:var(--gold)}

/* ================= BREAKPOINTS ================= */

@media (min-width:480px){
  :root{--gut:1.8rem}
}

@media (min-width:700px){
  :root{--col:40rem;--gut:2.2rem}
  .brand{font-size:1.42rem}
  header svg.seal{width:36px;height:36px}
  .tab{font-size:0.76rem;padding:1.15rem 0 1rem;margin-right:2.3rem}
  .txt{font-size:1rem;line-height:1.5}
  .item{padding-top:1.05rem;padding-bottom:1.05rem;gap:1.05rem}
  .box{width:16px;height:16px}
  main{padding-bottom:10rem}
  .sheet .wrap,.detail .wrap{max-width:40rem}
  .dtitle-txt{font-size:1.7rem}
}

@media (min-width:1000px){
  :root{--col:76rem;--gut:2.6rem}
  nav{display:none}
  footer{display:none}
  main{padding-bottom:0;display:flex}
  main > .wrap{display:flex;flex-direction:column}
  .board{
    display:grid;
    grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
    align-items:stretch;border-top:1px solid var(--hair);
    flex:1;min-height:0;
  }
  .col{
    border-right:1px solid var(--hair);
    display:flex;flex-direction:column;padding-bottom:1.4rem;min-height:0;
  }
  .col:last-child{border-right:none}
  .col .items{overflow-y:auto}
  .colhead{
    display:flex;align-items:baseline;gap:0.6rem;
    padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--hair);
  }
  .colhead h3{
    font-family:'Jost',sans-serif;font-weight:300;
    text-transform:uppercase;letter-spacing:0.2em;
    font-size:0.66rem;color:var(--ink);
  }
  .colhead .n{
    font-size:0.55rem;color:var(--gold);
    letter-spacing:0.1em;font-variant-numeric:tabular-nums;
  }
  .col .items{flex:1}
  .col .item{padding:0.85rem 1.5rem;gap:0.85rem}
  .col .txt{font-size:0.88rem}
  .col .empty{padding:2.6rem 1.5rem}
  .col .empty p{font-size:0.98rem}
  .col .empty .line{margin-bottom:1.2rem}
  .col .sweep{margin-top:1.2rem;font-size:0.54rem}
  .colfoot{padding:0.9rem 1.5rem 0}
  .colfoot .compose{padding-bottom:0.5rem}
  .colfoot input[type=text]{font-size:0.88rem}
  .colfoot input[type=text]::placeholder{font-size:0.84rem}
  .detail .wrap{max-width:46rem}
}

@media (min-width:1500px){
  :root{--col:88rem}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <svg class="seal" viewBox="0 0 96 96" fill="none" aria-hidden="true">
      <circle cx="48" cy="48" r="37" stroke-width="2" stroke="#BBA37D"/>

<script>
const DEFAULT_TABS = ['Fundamental','Lumina','BGIP','Personal'];
const KEY  = 'ledger.v1';
const TABKEY = KEY + '.tabs';
const WIDE = window.matchMedia('(min-width:1000px)');

/* TABS is now user-managed. It is derived from saved tab order, but any
   tab found in stored data is always kept so items can never be orphaned. */
let TABS = loadTabs();
let data = load();
reconcileTabs();

let active = localStorage.getItem(KEY + '.tab') || TABS[0];
if(!TABS.includes(active)) active = TABS[0];

/* open detail state */
let openTab = null;
let openItem = null;

function loadTabs(){
  try{
    const saved = JSON.parse(localStorage.getItem(TABKEY) || 'null');
    if(Array.isArray(saved) && saved.length) return saved.filter(t => typeof t === 'string' && t.trim());
  }catch(e){}
  return DEFAULT_TABS.slice();
}

/* Load every list present in storage, not just the known tabs, so nothing
   is ever silently dropped. */
function load(){
  const out = {};
  TABS.forEach(t => out[t] = []);
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    Object.keys(raw).forEach(t => {
      if(Array.isArray(raw[t])) out[t] = raw[t].map(normalize);
    });
  }catch(e){}
  return out;
}

/* Any tab that has data but isn't in the tab list gets appended, and any
   listed tab without data gets an empty list. Guarantees they stay in step. */
function reconcileTabs(){
  Object.keys(data).forEach(t => { if(!TABS.includes(t)) TABS.push(t); });
  TABS.forEach(t => { if(!Array.isArray(data[t])) data[t] = []; });
  if(!TABS.length){ TABS = DEFAULT_TABS.slice(); TABS.forEach(t => data[t] = data[t] || []); }
}

/* ensure every item has the current fields; older items just gain defaults */
function normalize(it){
  return {
    t: it.t || '',
    done: !!it.done,
    wait: !!it.wait,
    notes: typeof it.notes === 'string' ? it.notes : '',
    subs: Array.isArray(it.subs) ? it.subs.map(s => ({t: s.t || '', done: !!s.done})) : []
  };
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    localStorage.setItem(TABKEY, JSON.stringify(TABS));
    localStorage.setItem(KEY + '.tab', active);
  }catch(e){}
}

const navwrap  = document.getElementById('navwrap');
const stage    = document.getElementById('stage');
const scroller = document.getElementById('scroller');
const entry    = document.getElementById('entry');
const addBtn   = document.getElementById('add');
const count    = document.getElementById('count');
const sheet    = document.getElementById('sheet');
const scrim    = document.getElementById('scrim');
const stamp    = document.getElementById('stamp');
const file     = document.getElementById('file');
const detail   = document.getElementById('detail');
const dbody    = document.getElementById('dbody');
const dtabname = document.getElementById('dtabname');

/* Adopt an incoming set of lists (from cloud or a backup file) without
   dropping any list it contains. Tab order follows the incoming order,
   with any extra local tabs appended. */
function adoptLists(lists, order){
  const next = {};
  const incoming = Object.keys(lists).filter(k => Array.isArray(lists[k]));
  incoming.forEach(k => next[k] = lists[k].map(normalize));
  const newTabs = [];
  (Array.isArray(order) ? order : []).forEach(t => {
    if(incoming.includes(t) && !newTabs.includes(t)) newTabs.push(t);
  });
  incoming.forEach(t => { if(!newTabs.includes(t)) newTabs.push(t); });
  if(!newTabs.length) return false;
  data = next;
  TABS = newTabs;
  reconcileTabs();
  if(!TABS.includes(active)) active = TABS[0];
  return true;
}

function openCount(tab){ return (data[tab]||[]).filter(i => !i.done && !i.wait).length; }
function waitCount(tab){ return (data[tab]||[]).filter(i => i.wait && !i.done).length; }
function subFrac(item){
  if(!item.subs.length) return null;
  return item.subs.filter(s => s.done).length + '/' + item.subs.length;
}

/* ---------- a single list row ---------- */
function toggleWait(item){
  item.wait = !item.wait;
  if(item.wait) item.done = false;   // waiting and done are exclusive
  save(); render();
  if(navigator.vibrate) navigator.vibrate(12);
}

/* attach a long-press (and right-click on desktop) that toggles waiting */
function attachLongPress(el, item){
  let timer = null, moved = false, fired = false;
  const START = 460;

  const begin = () => {
    moved = false; fired = false;
    clearTimeout(timer);
    timer = setTimeout(() => { if(!moved){ fired = true; toggleWait(item); } }, START);
  };
  const cancel = () => { clearTimeout(timer); };

  el.addEventListener('touchstart', begin, {passive:true});
  el.addEventListener('touchmove', () => { moved = true; cancel(); }, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);

  el.addEventListener('mousedown', e => { if(e.button === 0) begin(); });
  el.addEventListener('mousemove', () => { moved = true; });
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);

  /* right-click is the desktop equivalent */
  el.addEventListener('contextmenu', e => { e.preventDefault(); toggleWait(item); });

  /* swallow the click that follows a long-press so it doesn't open detail */
  el.addEventListener('click', e => {
    if(fired){ e.stopPropagation(); e.preventDefault(); fired = false; }
  }, true);
}

function itemRow(tab, item){
  const row = document.createElement('div');
  row.className = 'item' + (item.done ? ' done' : '') + (item.wait && !item.done ? ' waiting' : '');

  const box = document.createElement('button');
  box.className = 'box';
  box.setAttribute('aria-label', item.done ? 'Mark not done' : 'Mark done');
  box.onclick = e => {
    e.stopPropagation();
    item.done = !item.done;
    if(item.done) item.wait = false;
    save(); render();
  };

  const body = document.createElement('div');
  body.className = 'body';
  body.onclick = () => openDetail(tab, item);
  attachLongPress(body, item);

  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = item.t;
  body.appendChild(txt);

  /* markers: waiting, notes, sub-item progress */
  const frac = subFrac(item);
  const showWait = item.wait && !item.done;
  if(showWait || item.notes.trim() || frac){
    const meta = document.createElement('div');
    meta.className = 'meta';
    if(showWait){
      const w = document.createElement('span');
      w.className = 'wtag';
      w.textContent = 'waiting';
      meta.appendChild(w);
    }
    if(item.notes.trim()){
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.title = 'Has notes';
      meta.appendChild(dot);
    }
    if(frac){
      const f = document.createElement('span');
      f.className = 'frac';
      f.textContent = frac;
      meta.appendChild(f);
    }
    body.appendChild(meta);
  }

  const chev = document.createElementNS('http://www.w3.org/2000/svg','svg');
  chev.setAttribute('class','chev');
  chev.setAttribute('viewBox','0 0 6 10');
  chev.setAttribute('fill','none');
  chev.innerHTML = '<path d="M1 1 L5 5 L1 9" stroke="#6E757B" stroke-width="1.2"/>';
  body.appendChild(chev);

  row.append(box, body);
  return row;
}

function emptyBlock(tab){
  const d = document.createElement('div');
  d.className = 'empty';
  d.innerHTML = '<div class="line"></div><p>Nothing on the ' + tab +
                ' list.</p><span>Add the first item below</span>';
  return d;
}
function sweepBtn(tab){
  const s = document.createElement('button');
  s.className = 'sweep';
  s.textContent = 'Clear completed';
  s.onclick = () => { data[tab] = data[tab].filter(i => !i.done); save(); render(); };
  return s;
}
function listInto(host, tab){
  const items = data[tab];
  if(!items.length){ host.appendChild(emptyBlock(tab)); return; }
  /* tier 0 = active, 1 = waiting, 2 = done */
  const tier = i => i.done ? 2 : (i.wait ? 1 : 0);
  const sorted = [...items].sort((a,b) => tier(a) - tier(b));

  let lastTier = null;
  sorted.forEach(item => {
    const t = tier(item);
    if(t === 1 && lastTier === 0) host.appendChild(tierRule('Waiting on someone else'));
    lastTier = t;
    host.appendChild(itemRow(tab, item));
  });
  if(items.some(i => i.done)) host.appendChild(sweepBtn(tab));
}

/* a faint labelled divider introducing the waiting group */
function tierRule(label){
  const d = document.createElement('div');
  d.className = 'tierrule';
  d.innerHTML = '<span>' + label + '</span>';
  return d;
}

function addTo(tab, value){
  const v = value.trim();
  if(!v) return false;
  data[tab].unshift({t: v, done: false, wait: false, notes: '', subs: []});
  save();
  return true;
}

/* ---------- narrow: tabbed ---------- */
function renderTabs(){
  navwrap.innerHTML = '';
  TABS.forEach(t => {
    const open = openCount(t);
    const b = document.createElement('button');
    b.className = 'tab' + (t === active ? ' on' : '');
    b.innerHTML = t + (open ? ' <span class="n">' + open + '</span>' : '');
    b.onclick = () => { active = t; save(); render(); };
    navwrap.appendChild(b);
  });
}
function renderNarrow(){
  renderTabs();
  const open = openCount(active);
  count.textContent = open ? open + ' open' : '';
  stage.innerHTML = '';
  listInto(stage, active);
}

/* ---------- wide: four columns ---------- */
function renderWide(){
  const total = TABS.reduce((n,t) => n + openCount(t), 0);
  count.textContent = total ? total + ' open' : '';
  stage.innerHTML = '';
  const board = document.createElement('div');
  board.className = 'board';
  board.style.setProperty('--cols', Math.max(1, TABS.length));
  TABS.forEach(tab => {
    const col = document.createElement('div');
    col.className = 'col';
    const head = document.createElement('div');
    head.className = 'colhead';
    const h = document.createElement('h3'); h.textContent = tab; head.appendChild(h);
    const open = openCount(tab);
    if(open){ const n = document.createElement('span'); n.className='n'; n.textContent=open; head.appendChild(n); }
    const items = document.createElement('div');
    items.className = 'items';
    listInto(items, tab);
    const foot = document.createElement('div');
    foot.className = 'colfoot';
    const comp = document.createElement('div');
    comp.className = 'compose';
    comp.innerHTML = '<svg class="wedge" viewBox="0 0 6 14" aria-hidden="true"><path d="M0 0 L6 0 L3 14 Z" fill="#BBA37D"/></svg>';
    const inp = document.createElement('input');
    inp.type='text'; inp.placeholder='Add an item'; inp.autocomplete='off';
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); if(addTo(tab, inp.value)){ refocus = tab; render(); } }
    });
    comp.appendChild(inp); foot.appendChild(comp);
    col.append(head, items, foot);
    board.appendChild(col);
  });
  stage.appendChild(board);
}
let refocus = null;
function render(){
  if(WIDE.matches) renderWide(); else renderNarrow();
  if(refocus && WIDE.matches){
    const i = TABS.indexOf(refocus);
    const inp = stage.querySelectorAll('.colfoot input')[i];
    if(inp) inp.focus();
  }
  refocus = null;
  /* keep an open detail view in sync */
  if(openItem) renderDetail();
}

/* ---------- narrow compose ---------- */
function add(){
  if(addTo(active, entry.value)){
    entry.value = '';
    addBtn.classList.remove('live');
    render();
    scroller.scrollTop = 0;
  }
}
addBtn.onclick = add;
entry.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } });
entry.addEventListener('input', () => addBtn.classList.toggle('live', entry.value.trim().length > 0));

if(WIDE.addEventListener) WIDE.addEventListener('change', render);
else WIDE.addListener(render);

/* ---------- detail view ---------- */
function autogrow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function openDetail(tab, item){
  openTab = tab; openItem = item;
  renderDetail();
  detail.classList.add('up');
  scrim.classList.add('up');
  dbody.scrollTop = 0;
}
function closeDetail(){
  detail.classList.remove('up');
  scrim.classList.remove('up');
  openTab = null; openItem = null;
  render();
}

function renderDetail(){
  if(!openItem) return;
  const item = openItem;
  dtabname.textContent = openTab;
  detail.classList.toggle('done-item', item.done);
  dbody.innerHTML = '';

  /* title row: checkbox + editable title */
  const title = document.createElement('div');
  title.className = 'dtitle';
  const box = document.createElement('button');
  box.className = 'box';
  box.onclick = () => { item.done = !item.done; save(); detail.classList.toggle('done-item', item.done); render(); };
  const tarea = document.createElement('textarea');
  tarea.className = 'dtitle-txt';
  tarea.rows = 1;
  tarea.value = item.t;
  tarea.setAttribute('enterkeyhint','done');
  tarea.addEventListener('input', () => { item.t = tarea.value; autogrow(tarea); save(); });
  tarea.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tarea.blur(); } });
  title.append(box, tarea);
  dbody.appendChild(title);

  /* notes */
  const nlabel = document.createElement('div');
  nlabel.className = 'dlabel'; nlabel.textContent = 'Notes';
  dbody.appendChild(nlabel);
  const notes = document.createElement('textarea');
  notes.className = 'notes';
  notes.placeholder = 'Add details, context, links...';
  notes.value = item.notes;
  notes.addEventListener('input', () => { item.notes = notes.value; autogrow(notes); save(); });
  dbody.appendChild(notes);

  /* sub-items */
  const slabel = document.createElement('div');
  slabel.className = 'dlabel';
  slabel.textContent = 'Checklist';
  dbody.appendChild(slabel);

  item.subs.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'sub' + (s.done ? ' done' : '');
    const sb = document.createElement('button');
    sb.className = 'subbox';
    sb.onclick = () => { s.done = !s.done; save(); renderDetail(); };
    const st = document.createElement('div');
    st.className = 'sub-txt';
    st.textContent = s.t;
    const sd = document.createElement('button');
    sd.className = 'sub-del';
    sd.textContent = '\u00d7';
    sd.onclick = () => { item.subs.splice(idx,1); save(); renderDetail(); };
    row.append(sb, st, sd);
    dbody.appendChild(row);
  });

  /* add sub-item */
  const addRow = document.createElement('div');
  addRow.className = 'subadd';
  const plus = document.createElement('div'); plus.className = 'plus';
  const sinp = document.createElement('input');
  sinp.type = 'text';
  sinp.placeholder = 'Add a checklist item';
  sinp.autocomplete = 'off';
  sinp.setAttribute('enterkeyhint','done');
  sinp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const v = sinp.value.trim();
      if(v){ item.subs.push({t: v, done: false}); save(); renderDetail();
             const again = dbody.querySelector('.subadd input'); if(again) again.focus(); }
    }
  });
  addRow.append(plus, sinp);
  dbody.appendChild(addRow);

  /* item tools */
  const tools = document.createElement('div');
  tools.className = 'dtools';

  const waitBtn = document.createElement('button');
  waitBtn.textContent = item.wait ? 'Stop waiting — make active' : 'Mark as waiting on someone else';
  waitBtn.onclick = () => {
    item.wait = !item.wait;
    if(item.wait) item.done = false;
    save(); renderDetail(); render();
  };
  tools.appendChild(waitBtn);

  const del = document.createElement('button');
  del.textContent = 'Delete this item';
  del.onclick = () => {
    data[openTab] = data[openTab].filter(x => x !== item);
    save(); closeDetail();
  };
  tools.appendChild(del);
  dbody.appendChild(tools);

  autogrow(tarea);
  autogrow(notes);
}

document.getElementById('back').onclick = closeDetail;

/* ========== SYNC ENGINE (private GitHub gist) ========== */
const SYNC = {
  tokenKey: KEY + '.gh.token',
  gistKey:  KEY + '.gh.gist',
  fileName: 'ledger.json',
  get token(){ return localStorage.getItem(this.tokenKey) || ''; },
  get gist(){ return localStorage.getItem(this.gistKey) || ''; },
  get on(){ return !!(this.token && this.gist); },
  busy: false,
  /* the revision this device last saw in the cloud */
  lastRev: null,
};

const syncStatusEl = document.getElementById('syncStatus');
const syncMsgEl    = document.getElementById('syncMsg');
const syncSheet    = document.getElementById('syncSheet');

function newRev(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function setStatus(state, text){
  // state: 'off' | 'on' | 'busy' | 'err' | 'warn'
  syncStatusEl.className = 'synced' + (state === 'off' ? '' : ' ' + state);
  syncStatusEl.innerHTML = '<span class="led"></span>' + (text || '');
}

function reflectSyncButtons(){
  const on = SYNC.on;
  document.getElementById('syncNow').style.display    = on ? '' : 'none';
  document.getElementById('pushBtn').style.display    = on ? '' : 'none';
  document.getElementById('pullBtn').style.display    = on ? '' : 'none';
  document.getElementById('syncSetupSub').textContent = on
    ? 'Connected — tap to manage' : 'Sync between phone and computer';
  document.getElementById('syncForget').style.display = on ? '' : 'none';
  if(on) setStatus('on', 'Sync connected'); else setStatus('off', 'Not syncing');
}

async function ghFetch(path, opts){
  return fetch('https://api.github.com' + path, {
    ...opts,
    headers: {
      'Authorization': 'token ' + SYNC.token,
      'Accept': 'application/vnd.github+json',
      ...(opts && opts.headers ? opts.headers : {}),
    },
  });
}

/* parse a gist file body into {rev, lists, order}, tolerating older formats */
function parseCloud(text){
  const raw = JSON.parse(text);
  if(raw && raw.__ledger && raw.lists){
    return { rev: raw.rev || null, lists: raw.lists, order: raw.order || null };
  }
  // legacy: the file was just the tabs object
  return { rev: null, lists: raw, order: null };
}

/* read just the current cloud rev without disturbing local data.
   returns {rev, lists} or null on failure. */
async function fetchCloud(){
  const res = await ghFetch('/gists/' + SYNC.gist, { method:'GET', cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const gist = await res.json();
  const f = gist.files && gist.files[SYNC.fileName];
  if(!f || !f.content) return { rev: null, lists: null };
  return parseCloud(f.content);
}

/* pull cloud copy into the app. returns true on success. */
async function syncPull(){
  if(!SYNC.on) return false;
  SYNC.busy = true; setStatus('busy', 'Pulling…');
  try{
    const { rev, lists, order } = await fetchCloud();
    if(lists && Object.keys(lists).length){
      adoptLists(lists, order);
      localStorage.setItem(KEY, JSON.stringify(data));
      localStorage.setItem(TABKEY, JSON.stringify(TABS));
      if(openItem){ openItem = null; closeDetail(); }
      render();
    }
    SYNC.lastRev = rev;
    SYNC.busy = false; setStatus('on', 'Up to date');
    return true;
  }catch(e){
    SYNC.busy = false; setStatus('err', 'Pull failed');
    return false;
  }
}

/* push current app data up to the gist, stamping a fresh rev.
   `force` skips the conflict check (used by the explicit Push button). */
async function syncPush(force){
  if(!SYNC.on) return false;
  SYNC.busy = true; setStatus('busy', 'Pushing…');
  try{
    // conflict guard: if the cloud moved since we last saw it, don't clobber
    if(!force){
      const cloud = await fetchCloud();
      if(cloud.rev && SYNC.lastRev && cloud.rev !== SYNC.lastRev){
        SYNC.busy = false;
        setStatus('warn', 'Cloud changed — open menu');
        conflictPending = true;
        return false;
      }
    }
    const rev = newRev();
    const payload = { __ledger: 1, rev, order: TABS, lists: data };
    const body = { files: { [SYNC.fileName]: { content: JSON.stringify(payload, null, 2) } } };
    const res = await ghFetch('/gists/' + SYNC.gist, { method:'PATCH', body: JSON.stringify(body) });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    SYNC.lastRev = rev;
    conflictPending = false;
    SYNC.busy = false; setStatus('on', 'Saved to cloud');
    return true;
  }catch(e){
    SYNC.busy = false; setStatus('err', 'Push failed');
    return false;
  }
}

let conflictPending = false;
let dirty = false;  // true when this device has an edit not yet pushed

/* debounced auto-push after edits */
let pushTimer = null;
function scheduleSync(){
  if(!SYNC.on) return;
  dirty = true;
  setStatus('busy', 'Saving…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    const ok = await syncPush(false);
    if(ok) dirty = false;
  }, 1400);
}

/* wrap save() so every change schedules a push */
const _save = save;
save = function(){ _save(); scheduleSync(); };

/* ---------- backup sheet ---------- */
function openSheet(){
  const total = TABS.reduce((n,t) => n + data[t].length, 0);
  stamp.textContent = total + (total === 1 ? ' item stored' : ' items stored');
  reflectSyncButtons();
  if(SYNC.on && conflictPending){
    setStatus('warn', 'Cloud changed elsewhere');
    document.getElementById('syncNowSub').textContent =
      'This device and the cloud both changed. Pull to take the cloud copy, or Push to keep this device.';
  }else{
    document.getElementById('syncNowSub').textContent = 'Pull, then push';
  }
  sheet.classList.add('up'); scrim.classList.add('up');
}
function closeSheet(){ sheet.classList.remove('up'); scrim.classList.remove('up'); }
function openSyncSheet(){
  document.getElementById('tokenIn').value = SYNC.token;
  document.getElementById('gistIn').value  = SYNC.gist;
  syncMsgEl.className = 'syncmsg'; syncMsgEl.textContent = '';
  document.getElementById('syncForget').style.display = SYNC.on ? '' : 'none';
  syncSheet.classList.add('up'); scrim.classList.add('up');
}
function closeSyncSheet(){ syncSheet.classList.remove('up'); }

/* ---------- manage lists ---------- */
const tabSheet  = document.getElementById('tabSheet');
const tabListEl = document.getElementById('tabList');
const tabMsgEl  = document.getElementById('tabMsg');
const newTabIn  = document.getElementById('newTabIn');

function tabMsg(text, kind){
  tabMsgEl.className = 'syncmsg' + (kind ? ' ' + kind : '');
  tabMsgEl.textContent = text || '';
}

function renderTabManager(){
  tabListEl.innerHTML = '';
  TABS.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'tabrow';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = name;
    inp.setAttribute('aria-label', 'List name');
    inp.addEventListener('change', () => renameTab(i, inp.value));
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });

    const cnt = document.createElement('span');
    cnt.className = 'cnt';
    const n = data[name] ? data[name].length : 0;
    cnt.textContent = n === 1 ? '1 item' : n + ' items';

    const up = document.createElement('button');
    up.className = 'tabbtn'; up.textContent = '\u2191';
    up.setAttribute('aria-label','Move up');
    up.disabled = (i === 0);
    up.onclick = () => moveTab(i, -1);

    const dn = document.createElement('button');
    dn.className = 'tabbtn'; dn.textContent = '\u2193';
    dn.setAttribute('aria-label','Move down');
    dn.disabled = (i === TABS.length - 1);
    dn.onclick = () => moveTab(i, 1);

    const rm = document.createElement('button');
    rm.className = 'tabbtn rm'; rm.textContent = '\u00d7';
    rm.setAttribute('aria-label','Remove list');
    rm.disabled = (TABS.length <= 1);
    rm.onclick = () => removeTab(i);

    row.append(inp, cnt, up, dn, rm);
    tabListEl.appendChild(row);
  });
}

function renameTab(i, raw){
  const next = (raw || '').trim();
  const prev = TABS[i];
  if(!next){ tabMsg('A list needs a name.', 'err'); renderTabManager(); return; }
  if(next === prev){ tabMsg(''); return; }
  if(TABS.some((t, j) => j !== i && t.toLowerCase() === next.toLowerCase())){
    tabMsg('There is already a list with that name.', 'err');
    renderTabManager(); return;
  }
  /* carry the items across to the new key, preserving order of tabs */
  const items = data[prev] || [];
  delete data[prev];
  data[next] = items;
  TABS[i] = next;
  if(active === prev) active = next;
  if(openTab === prev) openTab = next;
  save(); renderTabManager(); render();
  tabMsg('Renamed. Items kept.', 'ok');
}

function moveTab(i, dir){
  const j = i + dir;
  if(j < 0 || j >= TABS.length) return;
  const tmp = TABS[i]; TABS[i] = TABS[j]; TABS[j] = tmp;
  save(); renderTabManager(); render();
  tabMsg('');
}

function removeTab(i){
  const name = TABS[i];
  const n = (data[name] || []).length;
  if(TABS.length <= 1){ tabMsg('You need at least one list.', 'err'); return; }
  const msg = n
    ? 'Delete "' + name + '" and its ' + n + (n === 1 ? ' item?' : ' items?') +
      '\n\nThis cannot be undone. Save a backup first if you are unsure.'
    : 'Delete the empty list "' + name + '"?';
  if(!confirm(msg)) return;
  TABS.splice(i, 1);
  delete data[name];
  if(active === name) active = TABS[0];
  if(openTab === name){ openTab = null; openItem = null; closeDetail(); }
  save(); renderTabManager(); render();
  tabMsg('Removed "' + name + '".', 'ok');
}

function addTab(raw){
  const name = (raw || '').trim();
  if(!name){ return false; }
  if(TABS.some(t => t.toLowerCase() === name.toLowerCase())){
    tabMsg('There is already a list with that name.', 'err');
    return false;
  }
  TABS.push(name);
  if(!Array.isArray(data[name])) data[name] = [];
  save(); renderTabManager(); render();
  tabMsg('Added "' + name + '".', 'ok');
  return true;
}

function openTabSheet(){
  tabMsg('');
  renderTabManager();
  newTabIn.value = '';
  tabSheet.classList.add('up'); scrim.classList.add('up');
}
function closeTabSheet(){ tabSheet.classList.remove('up'); }

newTabIn.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(addTab(newTabIn.value)) newTabIn.value = '';
  }
});
document.getElementById('manageTabs').onclick = openTabSheet;
document.getElementById('tabBack').onclick = closeTabSheet;

document.getElementById('menu').onclick = openSheet;
scrim.onclick = () => { closeSheet(); closeSyncSheet(); closeTabSheet(); if(openItem) closeDetail(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeSheet(); closeSyncSheet(); closeTabSheet(); if(openItem) closeDetail(); }
});

/* sync buttons */
document.getElementById('syncSetup').onclick = openSyncSheet;
document.getElementById('syncBack').onclick  = closeSyncSheet;

document.getElementById('syncNow').onclick = async () => {
  // pull then push is always safe: we adopt cloud first, so no clobber
  const ok = await syncPull();
  if(ok) await syncPush(false);
};
document.getElementById('pushBtn').onclick = async () => {
  // explicit push is a deliberate "this device wins" — force past the guard
  const ok = await syncPush(true);
  if(ok){ conflictPending = false; dirty = false; }
};
document.getElementById('pullBtn').onclick = async () => {
  const ok = await syncPull();
  if(ok){ conflictPending = false; dirty = false; }
};

document.getElementById('syncSave').onclick = async () => {
  const token = document.getElementById('tokenIn').value.trim();
  const gist  = document.getElementById('gistIn').value.trim();
  syncMsgEl.className = 'syncmsg';
  if(!token || !gist){ syncMsgEl.classList.add('err'); syncMsgEl.textContent = 'Both fields are required.'; return; }
  syncMsgEl.textContent = 'Checking…';
  // temporarily store so ghFetch can use them, roll back on failure
  const prevT = SYNC.token, prevG = SYNC.gist;
  localStorage.setItem(SYNC.tokenKey, token);
  localStorage.setItem(SYNC.gistKey, gist);
  try{
    const res = await ghFetch('/gists/' + gist, { method:'GET', cache:'no-store' });
    if(res.status === 401 || res.status === 403){ throw new Error('bad-token'); }
    if(res.status === 404){ throw new Error('bad-gist'); }
    if(!res.ok){ throw new Error('http'); }
    // adopt the current cloud rev as our baseline so the guard has a reference
    try{ const c = await fetchCloud(); SYNC.lastRev = c.rev; }catch(e){}
    syncMsgEl.classList.add('ok');
    syncMsgEl.textContent = 'Connected. Use Push on the device that already has your items, Pull on the other.';
    reflectSyncButtons();
    document.getElementById('syncForget').style.display = '';
  }catch(e){
    localStorage.setItem(SYNC.tokenKey, prevT);
    localStorage.setItem(SYNC.gistKey, prevG);
    syncMsgEl.classList.add('err');
    syncMsgEl.textContent =
      e.message === 'bad-token' ? 'Token rejected. Check it has the gist scope.' :
      e.message === 'bad-gist'  ? 'Gist not found. Check the ID.' :
      'Could not connect. Check your connection and try again.';
  }
};

document.getElementById('syncForget').onclick = () => {
  localStorage.removeItem(SYNC.tokenKey);
  localStorage.removeItem(SYNC.gistKey);
  reflectSyncButtons();
  syncMsgEl.className = 'syncmsg';
  syncMsgEl.textContent = 'Disconnected on this device.';
  document.getElementById('tokenIn').value = '';
  document.getElementById('gistIn').value = '';
};

document.getElementById('exp').onclick = () => {
  const payload = { __ledger: 1, order: TABS, lists: data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = 'ledger-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeSheet();
};
document.getElementById('imp').onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      /* accept both the new {order, lists} wrapper and the older flat file */
      const lists = (parsed && parsed.__ledger && parsed.lists) ? parsed.lists : parsed;
      const order = (parsed && parsed.order) ? parsed.order : null;
      if(!lists || typeof lists !== 'object') throw new Error('shape');
      if(!adoptLists(lists, order)) throw new Error('empty');
      save(); render(); closeSheet();
    }catch(e){
      stamp.textContent = "That file isn't a Ledger backup";
    }
  };
  r.readAsText(f);
  file.value = '';
};

render();
reflectSyncButtons();

/* pull once on open so this device starts from the cloud copy */
if(SYNC.on){
  syncPull();
  /* when returning to the app after it was backgrounded:
     - if we have an unpushed edit, push it (conflict-guarded) instead of
       pulling, so we never silently discard local work
     - otherwise pull, so a device left open refreshes before you touch it */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible' || SYNC.busy) return;
    if(dirty){
      syncPush(false).then(ok => { if(ok) dirty = false; });
    }else{
      syncPull();
    }
  });
}

/* ---------- offline + durable storage ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(ok => { if(!ok) navigator.storage.persist(); }).catch(() => {});
}
</script>
</body>
