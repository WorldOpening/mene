<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Ledger</title>

<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#08090c">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090c;
  --panel:#0d0f13;
  --ink:#E7E9ED;
  --muted:#6E757B;
  --dim:#464C53;
  --gold:#BBA37D;
  --amber:#C9A96A;
  --rule:rgba(187,163,125,0.28);
  --hair:rgba(231,233,237,0.07);

  --col:34rem;
  --gut:1.4rem;
}
html,body{height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Jost',system-ui,-apple-system,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

.wrap{
  width:100%;
  max-width:var(--col);
  margin:0 auto;
  padding-left:var(--gut);
  padding-right:var(--gut);
}

/* ---------- masthead ---------- */
header{flex-shrink:0;padding-top:1.7rem;padding-bottom:1.1rem}
header .wrap{display:flex;align-items:center;gap:1rem}
header svg.seal{width:32px;height:32px;flex-shrink:0}
.brand{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:500;text-transform:uppercase;
  letter-spacing:0.3em;font-size:1.28rem;line-height:1;
  padding-left:0.3em;
}
.count{
  margin-left:auto;
  font-size:0.64rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--dim);font-variant-numeric:tabular-nums;
  padding-right:0.8rem;
  display:flex;align-items:center;gap:0.55rem;white-space:nowrap;
}
.count .sep{opacity:0.45}

/* the two sides of the ledger */
.sides{flex-shrink:0}
.sides .wrap{display:flex;align-items:baseline;gap:1.6rem;padding-bottom:0.9rem}
.sides button{
  background:none;border:none;cursor:pointer;padding:0.2rem 0 0.35rem;
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.64rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid transparent;
  font-variant-numeric:tabular-nums;
  transition:color .3s ease,border-color .3s ease;
}
.sides button .n{margin-left:0.6em;opacity:0.7}
.sides button.on{color:var(--gold);border-bottom-color:var(--rule)}
.sides button:not(.on):hover{color:var(--muted)}

/* Fundamental is the same ledger in a cold key, so the side is never in doubt */
html[data-side="fa"]{
  --bg:#07090d;
  --panel:#0b0e13;
  --gold:#8FA9C4;
  --amber:#A3B9CF;
  --rule:rgba(143,169,196,0.30);
}
html[data-side="fa"] svg [fill="#BBA37D"]{fill:var(--gold)}
html[data-side="fa"] svg [stroke="#BBA37D"]{stroke:var(--gold)}
body{transition:background-color .35s ease}
/* narrow screens: tighten the masthead so the menu can never be pushed off */
header .wrap > .mastbtn, header .wrap > .menu{flex-shrink:0}
.count{min-width:0;overflow:hidden}
@media (max-width:460px){
  header .wrap{gap:0.7rem}
  .brand{letter-spacing:0.2em;font-size:1.16rem}
  .count{letter-spacing:0.12em;gap:0.4rem;padding-right:0.3rem}
  .sides .wrap{gap:1.2rem}
}
/* the Fold's cover screen: numbers only, the waiting one still opens Pipeline */
@media (max-width:380px){
  .count .w{display:none}
  .count .waitlink{color:var(--amber)}
}
.tabbtn.mv{width:auto;min-width:2.6rem;padding:0 0.45rem;font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase}
.waitlink{
  background:none;border:none;cursor:pointer;
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.64rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--muted);padding:0;
  font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--hair);
  transition:color .3s ease,border-color .3s ease;
}
.waitlink:hover,.waitlink:active{color:var(--gold);border-bottom-color:var(--rule)}
.alertdot{
  background:none;border:none;cursor:pointer;padding:0.25rem 0.1rem;
  display:flex;align-items:center;
}
.alertdot i{
  display:block;width:6px;height:6px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 6px rgba(201,169,106,0.7);
  animation:pulse 1.8s ease-in-out infinite;
}
.menu{
  background:none;border:none;color:var(--dim);cursor:pointer;
  padding:0.4rem 0.15rem;display:flex;flex-direction:column;gap:3.5px;
  transition:color .3s ease;
}
.menu span{display:block;width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.menu:active,.menu:hover{color:var(--gold)}

/* ---------- tabs ---------- */
nav{flex-shrink:0;border-bottom:1px solid var(--hair)}
nav .wrap{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;
  font-family:'Jost',sans-serif;font-weight:300;
  color:var(--dim);text-transform:uppercase;letter-spacing:0.2em;
  font-size:0.72rem;padding:1.05rem 0 0.9rem;margin-right:1.9rem;
  white-space:nowrap;position:relative;cursor:pointer;
  transition:color .35s ease;
}
.tab::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;
  transition:transform .4s cubic-bezier(.2,.7,.2,1);
}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}
.tab:hover{color:var(--muted)}
.tab.on:hover{color:var(--ink)}
.tab .n{
  font-size:0.56rem;color:var(--dim);margin-left:0.5em;
  letter-spacing:0.1em;font-variant-numeric:tabular-nums;
}
.tab.on .n{color:var(--gold)}
.tab .w{
  font-size:0.5rem;color:var(--dim);margin-left:0.35em;
  letter-spacing:0.1em;font-variant-numeric:tabular-nums;opacity:0.75;
}
/* ---------- list ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:9rem}
main > .wrap{padding-left:0;padding-right:0}
.item{
  display:flex;align-items:flex-start;gap:0.95rem;
  padding:0.95rem var(--gut);
  border-bottom:1px solid var(--hair);
  animation:in .45s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.box{
  width:15px;height:15px;margin-top:3px;flex-shrink:0;
  border:1px solid var(--rule);border-radius:1px;
  background:none;cursor:pointer;position:relative;
  transition:border-color .3s ease;
}
.box::after{
  content:'';position:absolute;inset:2px;background:var(--gold);
  transform:scale(0);transition:transform .28s cubic-bezier(.3,1.4,.5,1);
}
.item.done .box{border-color:rgba(187,163,125,0.5)}
.item.done .box::after{transform:scale(1)}

/* tapping the body opens detail */
.body{
  flex:1;min-width:0;cursor:pointer;
  display:flex;align-items:flex-start;gap:0.7rem;
}
.txt{
  flex:1;font-size:0.94rem;font-weight:300;line-height:1.45;
  letter-spacing:0.012em;color:var(--ink);word-break:break-word;
  transition:color .35s ease;
}
.item.done .txt{  color:var(--dim);text-decoration:line-through;
  text-decoration-color:var(--rule);text-decoration-thickness:1px;
}
/* meta marker: notes / sub-item progress / who we are waiting on */
.meta{
  flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;gap:0.5rem;
  font-size:0.6rem;letter-spacing:0.08em;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.meta .dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--gold);opacity:0.7;
}
.meta .frac{color:var(--muted)}
.meta .wtag{
  text-transform:uppercase;letter-spacing:0.16em;
  font-size:0.52rem;color:var(--gold);opacity:0.75;
  max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta .wtag.stale{color:var(--amber);opacity:1}
.chev{
  flex-shrink:0;margin-top:5px;width:6px;height:10px;opacity:0.35;
  transition:opacity .3s ease;
}
.body:hover .chev{opacity:0.7}

/* ---------- waiting state: present but receded ---------- */
.item.waiting{opacity:0.52}
.item.waiting .txt{color:var(--muted);font-style:italic}
.item.waiting .box{
  border-color:var(--hair);
  border-style:dashed;
}
.item.waiting:hover{opacity:0.78}
.item.waiting .chev{opacity:0.2}

/* collapsible divider introducing the waiting group */
.tierrule{
  display:flex;align-items:center;gap:0.9rem;
  padding:1.5rem var(--gut) 0.55rem;
  width:100%;background:none;border:none;cursor:pointer;
  font-family:'Jost',sans-serif;
  transition:color .3s ease;
}
.tierrule .tl{flex:1;height:1px;background:var(--hair)}
.tierrule span{
  font-weight:300;
  text-transform:uppercase;letter-spacing:0.22em;
  font-size:0.55rem;color:var(--dim);white-space:nowrap;
  transition:color .3s ease;
}
.tierrule .tn{color:var(--muted);font-variant-numeric:tabular-nums}
.tierrule .tw{
  width:6px;height:6px;flex-shrink:0;
  border-right:1px solid var(--dim);border-bottom:1px solid var(--dim);
  transform:rotate(45deg) translate(-1px,-1px);
  transition:transform .3s ease,border-color .3s ease;
}
.tierrule.shut .tw{transform:rotate(-45deg) translate(-1px,1px)}
.tierrule:hover span,.tierrule:hover .tn{color:var(--gold)}
.tierrule:hover .tw{border-color:var(--gold)}

/* ---------- empty ---------- */
.empty{padding:4.5rem 2.6rem;text-align:center;animation:in .5s ease both}
.empty .line{width:38px;height:1px;background:var(--rule);margin:0 auto 1.7rem}
.empty p{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.12rem;color:var(--muted);letter-spacing:0.04em;line-height:1.6;
}
.empty span{
  display:block;margin-top:0.9rem;font-family:'Jost',sans-serif;
  font-size:0.6rem;text-transform:uppercase;letter-spacing:0.24em;color:var(--dim);
}

/* ---------- compose ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;
  padding-top:0.9rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,rgba(8,9,12,0));
}
footer .wrap{display:flex;align-items:center;gap:0.9rem}
.compose{
  flex:1;display:flex;align-items:center;gap:0.85rem;
  border-bottom:1px solid var(--rule);padding-bottom:0.55rem;
  transition:border-color .4s ease;
}
.compose:focus-within{border-color:var(--gold)}
.wedge{width:7px;height:13px;flex-shrink:0;opacity:0.75}
input[type=text]{
  flex:1;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);
  font-size:16px;letter-spacing:0.012em;padding:0;
}
input[type=text]::placeholder{color:var(--dim);letter-spacing:0.05em;font-size:0.94rem}
.add{
  background:none;border:1px solid var(--rule);color:var(--gold);
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  font-size:1.1rem;line-height:1;font-family:'Jost',sans-serif;font-weight:300;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;opacity:0.4;
  transition:background .3s ease,border-color .3s ease,opacity .3s ease;
}
.add.live{opacity:1;border-color:var(--gold)}
.add:active,.add:hover{background:rgba(187,163,125,0.14)}

/* ---------- sweep ---------- */
.sweep{
  display:block;margin:1.9rem auto 0;background:none;border:none;
  color:var(--dim);font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.58rem;text-transform:uppercase;letter-spacing:0.24em;
  cursor:pointer;padding:0.6rem 1rem;transition:color .35s ease;
}
.sweep:active,.sweep:hover{color:var(--gold)}

/* ---------- scrim (shared by sheet + detail) ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,0.62);
  opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40;
}
.scrim.up{opacity:1;pointer-events:auto}

/* ---------- backup sheet ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--rule);
  padding-top:1.7rem;padding-bottom:calc(1.6rem + env(safe-area-inset-bottom));
  transform:translateY(101%);
  transition:transform .42s cubic-bezier(.2,.7,.2,1);
  max-height:92vh;overflow-y:auto;
}
.sheet.up{transform:translateY(0)}
.sheet h2{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  text-transform:uppercase;letter-spacing:0.26em;font-size:0.8rem;
  color:var(--muted);padding-left:0.26em;margin-bottom:1.4rem;
}
.act{
  display:block;width:100%;text-align:left;background:none;border:none;
  border-top:1px solid var(--hair);color:var(--ink);
  font-family:'Jost',sans-serif;font-weight:300;font-size:0.88rem;
  letter-spacing:0.06em;padding:1.05rem 0.1rem;cursor:pointer;
  transition:color .3s ease;
}
.act:active,.act:hover{color:var(--gold)}
.act small{
  display:block;color:var(--dim);font-size:0.66rem;
  letter-spacing:0.1em;margin-top:0.3rem;
}
.act .badge{
  float:right;color:var(--gold);font-size:0.66rem;
  letter-spacing:0.16em;font-variant-numeric:tabular-nums;
}
.stamp{
  margin-top:1.5rem;text-align:center;font-size:0.55rem;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);
}
#file{display:none}

/* sync status line at top of sheet */
.synced{
  font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--dim);padding-bottom:1rem;
  display:flex;align-items:center;gap:0.55rem;
}
.synced .led{
  width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0;
}
.synced.on .led{background:var(--gold);box-shadow:0 0 6px rgba(187,163,125,0.6)}
.synced.busy .led{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.synced.err .led{background:#B4776B}
.synced.warn .led{background:var(--amber);box-shadow:0 0 6px rgba(201,169,106,0.7)}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* sync setup form */
#syncSheet{z-index:55}
#tabSheet{z-index:56}

/* manage panels */
.tablist{display:flex;flex-direction:column;margin-bottom:0.4rem}
.tabrow{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.75rem 0;border-top:1px solid var(--hair);
}
.tablist .tabrow:last-child{border-bottom:1px solid var(--hair)}
.tabrow input{
  flex:1;min-width:0;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);
  font-size:16px;letter-spacing:0.03em;padding:0.1rem 0;
  border-bottom:1px solid transparent;
  transition:border-color .3s ease;
}
.tabrow input:focus{border-bottom-color:var(--rule)}
.tabrow .cnt{
  font-size:0.58rem;letter-spacing:0.14em;color:var(--dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tabbtn{
  background:none;border:none;color:var(--dim);cursor:pointer;
  padding:0.25rem 0.3rem;font-size:0.95rem;line-height:1;
  font-family:'Jost',sans-serif;font-weight:300;
  transition:color .3s ease;
}
.tabbtn:hover,.tabbtn:active{color:var(--gold)}
.tabbtn.rm:hover,.tabbtn.rm:active{color:#C08A7E}
.tabbtn[disabled]{opacity:0.22;cursor:default}
.tabbtn[disabled]:hover{color:var(--dim)}
.syncform{display:flex;flex-direction:column}
.synclabel{
  font-family:'Jost',sans-serif;font-weight:400;
  text-transform:uppercase;letter-spacing:0.2em;font-size:0.58rem;
  color:var(--dim);margin:1rem 0 0.5rem;
}
.syncinput{
  background:none;border:none;border-bottom:1px solid var(--rule);
  outline:none;color:var(--ink);
  font-family:'Jost',sans-serif;font-weight:300;font-size:16px;
  letter-spacing:0.02em;padding:0.3rem 0 0.55rem;
  transition:border-color .3s ease;
}
.syncinput:focus{border-color:var(--gold)}
.syncinput::placeholder{color:var(--dim)}
.syncmsg{
  min-height:1.1rem;margin:1rem 0 0.2rem;
  font-size:0.64rem;letter-spacing:0.06em;color:var(--muted);line-height:1.5;
}
.syncmsg.err{color:#C08A7E}
.syncmsg.ok{color:var(--gold)}

/* ---------- long-term projects ---------- */
.mastbtn{
  background:none;border:none;color:var(--dim);cursor:pointer;
  padding:0.35rem 0.15rem;margin-right:0.85rem;
  display:flex;align-items:center;gap:0.4rem;
  transition:color .3s ease;
}
.mastbtn svg{width:15px;height:15px;display:block}
.mastbtn .ln{
  font-size:0.6rem;letter-spacing:0.18em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.mastbtn:active,.mastbtn:hover{color:var(--gold)}
.mastbtn:active .ln,.mastbtn:hover .ln{color:var(--gold)}

.item.lt{opacity:0.72}
.item.lt .box{border-radius:50%}
.item.lt .txt{color:var(--ink)}
.item.lt:hover{opacity:1}
.meta .nxt{
  color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:22ch;
}
.meta .nxt::before{content:'\2192\00a0';color:var(--dim)}
.tierrule.longterm span{color:var(--gold);opacity:0.7}

#proj{z-index:58}
.projbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:2.5rem}
.pcard{
  padding:1.15rem var(--gut);
  border-bottom:1px solid var(--hair);
  cursor:pointer;
  animation:in .4s cubic-bezier(.2,.7,.2,1) both;
  transition:background .3s ease;
}
.pcard:hover{background:rgba(187,163,125,0.035)}
.pcard.shut{opacity:0.5}
.pcard .ptxt{cursor:pointer}
.pnext{
  margin-top:0.42rem;font-size:0.78rem;line-height:1.45;
  color:var(--muted);letter-spacing:0.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pnext em{color:var(--dim);font-style:italic}
.pbar{
  margin-top:0.8rem;height:1px;width:100%;
  background:var(--hair);position:relative;overflow:hidden;
}
.pbar i{
  display:block;height:1px;background:var(--gold);opacity:0.75;
  transition:width .4s cubic-bezier(.2,.7,.2,1);
}
.projadd{padding:1.6rem var(--gut) 0}
.projadd .compose{width:100%}

.pmeter{
  padding:0.2rem var(--gut) 0;
  display:flex;align-items:center;gap:0.8rem;
  font-size:0.55rem;text-transform:uppercase;letter-spacing:0.2em;
  color:var(--dim);font-variant-numeric:tabular-nums;
}
.pmeter .pbar{margin-top:0;flex:1}

.step{
  display:flex;align-items:flex-start;gap:0.9rem;
  padding:0.72rem var(--gut);
  border-bottom:1px solid var(--hair);
}
.step:first-of-type{border-top:1px solid var(--hair)}
.step.kid{padding-left:calc(var(--gut) + 1.85rem)}
.step .stin{
  flex:1;background:none;border:none;outline:none;
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:0.9rem;line-height:1.4;color:var(--ink);
  letter-spacing:0.012em;padding:0;min-width:0;
}
.step.kid .stin{font-size:0.84rem;color:var(--muted)}
.step .stin::placeholder{color:var(--dim)}
.step.done .stin{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--rule)}
.step .sbtn{
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:1rem;line-height:1;padding:0.1rem 0.25rem;
  transition:color .3s ease;
}
.step .sbtn:active,.step .sbtn:hover{color:var(--gold)}
.step .sfrac{
  font-size:0.55rem;letter-spacing:0.16em;color:var(--dim);
  font-variant-numeric:tabular-nums;padding-top:0.28rem;
}

/* ---------- detail view / pipeline (shared shell) ---------- */
.detail{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);

/* notes */

<script>
const APP_VERSION = 'v11';
const DEFAULT_TABS = ['Fundamental','Lumina','BGIP','Personal'];

/* storage keys — ledger.v1 is permanent and is never renamed */
const KEY     = 'ledger.v1';
const TABKEY  = KEY + '.tabs';
const UIKEY   = KEY + '.ui';
const SPACEKEY = KEY + '.spaces';   /* { panel: 'own' | 'fa' } */
const SIDEKEY  = KEY + '.side';     /* which side is showing */
const SIDES    = { own: 'Own', fa: 'Fundamental' };

const WIDE = window.matchMedia('(min-width:1000px)');

/* an item counts as stale once nothing has happened for this long */
const STALE_DAYS = 10;

/* set false when anything in storage could not be read as expected, so the
   migrated copy is never written back over data we failed to understand */
let loadClean = true;
let storageFailed = false;

let ALL      = loadTabs();      /* every panel on both sides, in order */
let SPACEMAP = loadSpaces();
let SPACE    = loadSide();
let TABS     = [];              /* the panels on the side showing */
let UI     = loadUI();          /* {waitOpen:{panel:bool}, pipeSort:'age'|'panel'} */
let data   = load();
reconcileTabs();

let active = TABS[0];
try{ active = localStorage.getItem(KEY + '.tab.' + SPACE) || localStorage.getItem(KEY + '.tab') || TABS[0]; }catch(e){}
if(!TABS.includes(active)) active = TABS[0];
applySide();

/* open detail state */
let openTab  = null;
let openItem = null;
let cameFromPipe = false;

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadTabs(){
  try{
    const saved = JSON.parse(localStorage.getItem(TABKEY) || 'null');
    if(Array.isArray(saved) && saved.length) return saved.filter(t => typeof t === 'string' && t.trim());
  }catch(e){}
  return DEFAULT_TABS.slice();
}

function loadSpaces(){
  try{
    const saved = JSON.parse(localStorage.getItem(SPACEKEY) || 'null');
    if(saved && typeof saved === 'object') return saved;
  }catch(e){}
  return {};
}
function loadSide(){
  try{ return localStorage.getItem(SIDEKEY) === 'fa' ? 'fa' : 'own'; }catch(e){ return 'own'; }
}
/* a panel with no recorded side goes to Fundamental only if that is its name */
function spaceOf(t){
  if(SPACEMAP[t] === 'fa' || SPACEMAP[t] === 'own') return SPACEMAP[t];
  return /^(fundamental|fa)$/i.test(String(t).trim()) ? 'fa' : 'own';
}
function deriveTabs(){ TABS = ALL.filter(t => spaceOf(t) === SPACE); }
/* each side always has at least one panel to type into */
function ensureSides(){
  ['own', 'fa'].forEach(side => {
    if(ALL.some(t => spaceOf(t) === side)) return;
    let name = side === 'fa' ? 'Fundamental' : 'Personal';
    while(ALL.some(t => t.toLowerCase() === name.toLowerCase())) name += ' 2';
    ALL.push(name); SPACEMAP[name] = side;
    if(!Array.isArray(data[name])) data[name] = [];
  });
  ALL.forEach(t => { SPACEMAP[t] = spaceOf(t); });
}
/* fold the showing side's panels back into the full list, keeping the other
   side exactly as it was */
function syncAll(){
  const others = ALL.filter(t => !TABS.includes(t) && spaceOf(t) !== SPACE);
  TABS.forEach(t => { SPACEMAP[t] = SPACE; });
  ALL = others.concat(TABS);
  Object.keys(SPACEMAP).forEach(k => { if(!ALL.includes(k)) delete SPACEMAP[k]; });
}
function applySide(){ document.documentElement.setAttribute('data-side', SPACE); }

function loadUI(){
  try{
    const saved = JSON.parse(localStorage.getItem(UIKEY) || 'null');
    if(saved && typeof saved === 'object'){
      return {
        waitOpen: (saved.waitOpen && typeof saved.waitOpen === 'object') ? saved.waitOpen : {},
        ltOpen:   (saved.ltOpen   && typeof saved.ltOpen   === 'object') ? saved.ltOpen   : {},
        pipeSort: saved.pipeSort === 'panel' ? 'panel' : 'age',
      };
    }
  }catch(e){}
  return { waitOpen:{}, ltOpen:{}, pipeSort:'age' };
}

/* Load every panel present in storage, not just the known tabs, so nothing
   is ever silently dropped. */
function load(){
  const out = {};
  ALL.forEach(t => out[t] = []);
  let txt = null;
  try{ txt = localStorage.getItem(KEY); }
  catch(e){ loadClean = false; return out; }
  if(txt === null || txt === '') return out;      /* genuinely empty, not damaged */

  let raw = null;
  try{ raw = JSON.parse(txt); }catch(e){ raw = null; }
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)){
    loadClean = false; keepRescueCopy(txt); return out;
  }
  Object.keys(raw).forEach(t => {
    if(Array.isArray(raw[t])) out[t] = raw[t].map(normalize);
    else { loadClean = false; keepRescueCopy(txt); }
  });
  return out;
}

/* stash the exact bytes we could not read, once, so nothing is unrecoverable */
function keepRescueCopy(txt){
  try{
    if(!localStorage.getItem(KEY + '.rescue')) localStorage.setItem(KEY + '.rescue', txt);
  }catch(e){}
}

/* Any panel that has data but isn't in the list gets appended, and any listed
   panel without data gets an empty list. Guarantees they stay in step. */
function reconcileTabs(){
  Object.keys(data).forEach(t => { if(!ALL.includes(t)) ALL.push(t); });
  ALL.forEach(t => { if(!Array.isArray(data[t])) data[t] = []; });
  if(!ALL.length){ ALL = DEFAULT_TABS.slice(); ALL.forEach(t => data[t] = data[t] || []); }
  ensureSides();
  deriveTabs();
}

/* Bring an item up to the current shape. Unknown fields are carried through
   untouched, so nothing a past or future version stored is ever discarded. */
function normalize(it){
  const o = (it && typeof it === 'object' && !Array.isArray(it)) ? Object.assign({}, it) : {};
  o.id    = (typeof o.id === 'string' && o.id) ? o.id : uid();
  o.t     = typeof o.t === 'string' ? o.t
          : (typeof o.text === 'string' ? o.text : (typeof o.title === 'string' ? o.title : ''));
  o.done  = !!o.done;
  o.wait  = !!o.wait;
  o.who   = typeof o.who === 'string' ? o.who : '';
  o.notes = typeof o.notes === 'string' ? o.notes : '';
  o.subs  = Array.isArray(o.subs)
          ? o.subs.map(s => (s && typeof s === 'object')
              ? Object.assign({}, s, {t: typeof s.t === 'string' ? s.t : '', done: !!s.done})
              : {t: String(s == null ? '' : s), done:false})
          : [];
  o.lt    = !!o.lt;
  o.steps = Array.isArray(o.steps)
          ? o.steps.map(s => (s && typeof s === 'object')
              ? Object.assign({}, s, {
                  t: typeof s.t === 'string' ? s.t : '',
                  done: !!s.done,
                  subs: Array.isArray(s.subs)
                      ? s.subs.map(k => (k && typeof k === 'object')
                          ? Object.assign({}, k, {t: typeof k.t === 'string' ? k.t : '', done: !!k.done})
                          : {t: String(k == null ? '' : k), done:false})
                      : []
                })
              : {t: String(s == null ? '' : s), done:false, subs:[]})
          : [];
  o.since  = typeof o.since  === 'number' ? o.since  : null;
  o.nudged = typeof o.nudged === 'number' ? o.nudged : null;
  /* an item already marked waiting before this version has no start date —
     begin its clock now rather than pretending it is ancient */
  if(o.wait && !o.since) o.since = Date.now();
  if(!o.wait){ o.since = null; o.nudged = null; }
  return o;
}

/* each key is written on its own: a quota failure on one must not silently
   skip the rest, and a failure on the items themselves has to be visible */
function put(k, v){
  try{ localStorage.setItem(k, v); return true; }
  catch(e){ return false; }
}
function save(){
  syncAll();
  const okItems = put(KEY, JSON.stringify(data));
  put(TABKEY, JSON.stringify(ALL));
  put(SPACEKEY, JSON.stringify(SPACEMAP));
  put(SIDEKEY, SPACE);
  put(UIKEY, JSON.stringify(UI));
  put(KEY + '.tab', active);
  put(KEY + '.tab.' + SPACE, active);
  if(storageFailed !== !okItems){ storageFailed = !okItems; renderAlerts(); }
}
function saveUI(){
  try{ localStorage.setItem(UIKEY, JSON.stringify(UI)); }catch(e){}
}

const navwrap  = document.getElementById('navwrap');
const stage    = document.getElementById('stage');
const scroller = document.getElementById('scroller');
const entry    = document.getElementById('entry');
const addBtn   = document.getElementById('add');
const count    = document.getElementById('count');
const sheet    = document.getElementById('sheet');
const scrim    = document.getElementById('scrim');
const stamp    = document.getElementById('stamp');
const file     = document.getElementById('file');
const detail   = document.getElementById('detail');
const dbody    = document.getElementById('dbody');
const dtabname = document.getElementById('dtabname');
const pipe     = document.getElementById('pipe');
const pipebody = document.getElementById('pipebody');

/* Adopt an incoming set of panels (from cloud or a backup file) without
   dropping any panel it contains. Order follows the incoming order, with
   any extra local panels appended. */
function adoptLists(lists, order, spaces){
  const next = {};
  const incoming = Object.keys(lists).filter(k => Array.isArray(lists[k]));
  incoming.forEach(k => next[k] = lists[k].map(normalize));
  const newTabs = [];
  (Array.isArray(order) ? order : []).forEach(t => {
    if(incoming.includes(t) && !newTabs.includes(t)) newTabs.push(t);
  });
  incoming.forEach(t => { if(!newTabs.includes(t)) newTabs.push(t); });
  if(!newTabs.length) return false;
  data = next;
  ALL = newTabs;
  if(spaces && typeof spaces === 'object'){
    Object.keys(spaces).forEach(k => { if(spaces[k] === 'fa' || spaces[k] === 'own') SPACEMAP[k] = spaces[k]; });
  }
  reconcileTabs();
  if(!TABS.includes(active)) active = TABS[0];
  return true;
}

function openCount(tab){ return (data[tab]||[]).filter(i => !i.done && !i.wait && !i.lt).length; }
function waitCount(tab){ return (data[tab]||[]).filter(i => i.wait && !i.done && !i.lt).length; }
function totalWaiting(){ return TABS.reduce((n,t) => n + waitCount(t), 0); }
function subFrac(item){
  if(!item.subs.length) return null;
  return item.subs.filter(s => s.done).length + '/' + item.subs.length;
}

/* ---------- long-term helpers ---------- */
function isLT(i){ return !!i.lt && !i.done; }
function ltCount(tab){ return (data[tab]||[]).filter(isLT).length; }
function totalLT(){ return TABS.reduce((n,t) => n + ltCount(t), 0); }
function stepList(item){
  if(!Array.isArray(item.steps)) item.steps = [];
  return item.steps;
}
function kidList(step){
  if(!Array.isArray(step.subs)) step.subs = [];
  return step.subs;
}
function stepStats(item){
  const st = stepList(item);
  return { done: st.filter(s => s.done).length, total: st.length };
}
/* the first thing still to do: an unfinished sub-step if there is one, else the step */
function nextStep(item){
  const st = stepList(item);
  for(let i = 0; i < st.length; i++){
    if(st[i].done) continue;
    const k = kidList(st[i]).find(x => !x.done);
    const t = (k ? k.t : st[i].t).trim();
    if(t) return t;
  }
  return '';
}
function makeLT(item){
  item.lt = true;
  item.done = false;
  stepList(item);
  if(!item.steps.length && item.subs.length){
    item.steps = item.subs.map(s => ({t: s.t, done: !!s.done, subs: []}));
    item.subs = [];
  }
}
/* going back to a quick item keeps every line: nesting is flattened, nothing dropped */
function unmakeLT(item){
  const flat = [];
  stepList(item).forEach(s => {
    flat.push({t: s.t, done: !!s.done});
    kidList(s).forEach(k => flat.push({t: k.t, done: !!k.done}));
  });
  item.subs = item.subs.concat(flat.filter(x => x.t.trim()));
  item.steps = [];
  item.lt = false;
}

/* ---------- waiting helpers ---------- */
const DAY = 86400000;

function daysSince(ms){
  if(!ms) return 0;
  return Math.floor((Date.now() - ms) / DAY);
}
/* how long this has sat without any movement */
function quietDays(item){
  return daysSince(item.nudged || item.since);
}
function isStale(item){
  return !!item.since && quietDays(item) >= STALE_DAYS;
}
function ageText(ms){
  if(!ms) return '';
  const d = daysSince(ms);
  if(d <= 0) return 'today';
  if(d === 1) return '1 day';
  if(d < 14)  return d + ' days';
  if(d < 63)  return Math.round(d / 7) + ' wks';
  return Math.round(d / 30) + ' mo';
}
function shortAge(ms){
  if(!ms) return '';
  const d = daysSince(ms);
  if(d <= 0) return 'today';
  if(d < 14)  return d + 'd';
  if(d < 63)  return Math.round(d / 7) + 'w';
  return Math.round(d / 30) + 'mo';
}

function setWait(item, on){
  item.wait = !!on;
  if(item.wait){
    item.done = false;
    if(!item.since) item.since = Date.now();
  }else{
    item.since = null;
    item.nudged = null;
  }
}
function toggleWait(item){
  setWait(item, !item.wait);
  save(); render(); renderPipe();
  if(navigator.vibrate) navigator.vibrate(12);
}

function itemRow(tab, item){
  const row = document.createElement('div');
  row.className = 'item' + (item.done ? ' done' : '') + (item.wait && !item.done ? ' waiting' : '')
                + (isLT(item) ? ' lt' : '');

  const box = document.createElement('button');
  box.className = 'box';
  box.setAttribute('aria-label', item.done ? 'Mark not done' : 'Mark done');
  box.onclick = e => {
    e.stopPropagation();
    item.done = !item.done;
    if(item.done) setWait(item, false);
    save(); render();
  };

  const body = document.createElement('div');
  body.className = 'body';
  body.onclick = () => isLT(item) ? openProject(tab, item, false) : openDetail(tab, item);

  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = item.t;
  body.appendChild(txt);

  /* markers: waiting, notes, sub-item progress */
  const lt = isLT(item);
  const st = lt ? stepStats(item) : null;
  const frac = lt ? (st.total ? st.done + '/' + st.total : null) : subFrac(item);
  const nxt  = lt ? nextStep(item) : '';
  const showWait = item.wait && !item.done;
  if(showWait || nxt || item.notes.trim() || frac){
    const meta = document.createElement('div');
    meta.className = 'meta';
    if(showWait){
      const w = document.createElement('span');
      w.className = 'wtag' + (isStale(item) ? ' stale' : '');
      w.textContent = (item.who.trim() ? item.who.trim() : 'waiting') + ' · ' + shortAge(item.since);
      meta.appendChild(w);
    }
    if(nxt){
      const nx = document.createElement('span');
      nx.className = 'nxt';
      nx.textContent = nxt;
      meta.appendChild(nx);
    }
    if(item.notes.trim() && !nxt){
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.title = 'Has notes';
      meta.appendChild(dot);
    }
    if(frac){
      const f = document.createElement('span');
      f.className = 'frac';
      f.textContent = frac;
      meta.appendChild(f);
    }
    body.appendChild(meta);
  }

  const chev = document.createElementNS('http://www.w3.org/2000/svg','svg');
  chev.setAttribute('class','chev');
  chev.setAttribute('viewBox','0 0 6 10');
  chev.setAttribute('fill','none');
  chev.innerHTML = '<path d="M1 1 L5 5 L1 9" stroke="#6E757B" stroke-width="1.2"/>';
  body.appendChild(chev);

  row.append(box, body);
  return row;
}

function emptyBlock(tab){
  const d = document.createElement('div');
  d.className = 'empty';
  d.innerHTML = '<div class="line"></div><p>Nothing on the ' + escapeHtml(tab) +
                ' panel.</p><span>Add the first item below</span>';
  return d;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function sweepBtn(tab){
  const s = document.createElement('button');
  s.className = 'sweep';
  s.textContent = 'Clear completed';
  s.onclick = () => { data[tab] = data[tab].filter(i => !i.done); save(); render(); };
  return s;
}

/* a panel's waiting group starts collapsed and remembers what you set */
function waitOpenFor(tab){
  return UI.waitOpen[tab] === true;
}

function listInto(host, tab){
  const items = data[tab];
  if(!items.length){ host.appendChild(emptyBlock(tab)); return; }

  const activeItems = items.filter(i => !i.done && !i.wait && !i.lt);
  const waiting     = items.filter(i => !i.done && i.wait && !i.lt)
                           .sort((a,b) => (a.since || 0) - (b.since || 0));
  const longterm    = items.filter(i => !i.done && i.lt);
  const doneItems   = items.filter(i => i.done);

  activeItems.forEach(i => host.appendChild(itemRow(tab, i)));

  if(waiting.length){
    const open = waitOpenFor(tab);
    const stale = waiting.filter(isStale).length;
    host.appendChild(tierRule(tab, waiting.length, stale, open));
    if(open) waiting.forEach(i => host.appendChild(itemRow(tab, i)));
  }

  if(longterm.length){
    const open = ltOpenFor(tab);
    host.appendChild(ltRule(tab, longterm.length, open));
    if(open) longterm.forEach(i => host.appendChild(itemRow(tab, i)));
  }

  doneItems.forEach(i => host.appendChild(itemRow(tab, i)));
  if(doneItems.length) host.appendChild(sweepBtn(tab));
}

/* long-term group sits under the quick items and folds the same way */
function ltOpenFor(tab){
  return UI.ltOpen[tab] === true;
}
function ltRule(tab, n, open){
  const b = document.createElement('button');
  b.className = 'tierrule longterm' + (open ? '' : ' shut');
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  const label = document.createElement('span');
  label.textContent = 'Long term';
  const num = document.createElement('span');
  num.className = 'tn';
  num.textContent = String(n);
  const line = document.createElement('span');
  line.className = 'tl';
  const wedge = document.createElement('span');
  wedge.className = 'tw';
  b.append(label, num, line, wedge);
  b.onclick = () => { UI.ltOpen[tab] = !open; saveUI(); render(); };
  return b;
}

/* faint labelled divider introducing the waiting group; tapping folds it away */
function tierRule(tab, n, stale, open){
  const b = document.createElement('button');
  b.className = 'tierrule' + (open ? '' : ' shut');
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  const label = document.createElement('span');
  label.textContent = 'Waiting on others';
  const num = document.createElement('span');
  num.className = 'tn';
  num.textContent = stale ? n + ' · ' + stale + ' stale' : String(n);
  const line = document.createElement('span');
  line.className = 'tl';
  const wedge = document.createElement('span');
  wedge.className = 'tw';
  b.append(label, num, line, wedge);
  b.onclick = () => {
    UI.waitOpen[tab] = !open;
    saveUI();
    render();
  };
  return b;
}

function addTo(tab, value){
  const v = value.trim();
  if(!v) return false;
  data[tab].unshift(normalize({t: v}));
  save();
  return true;
}

/* ---------- narrow: tabbed ---------- */
function renderTabs(){
  navwrap.innerHTML = '';
  TABS.forEach(t => {
    const open = openCount(t);
    const wait = waitCount(t);
    const b = document.createElement('button');
    b.className = 'tab' + (t === active ? ' on' : '');
    b.innerHTML = escapeHtml(t)
      + (open ? ' <span class="n">' + open + '</span>' : '')
      + (wait ? ' <span class="w">+' + wait + '</span>' : '');
    b.onclick = () => { active = t; save(); render(); };
    navwrap.appendChild(b);
  });
}
function renderNarrow(){
  renderTabs();
  renderCount(openCount(active), totalWaiting());
  stage.innerHTML = '';
  listInto(stage, active);
}

function renderCount(open, waiting){
  count.innerHTML = '';
  if(open){
    const o = document.createElement('span');
    o.innerHTML = open + '<span class="w"> open</span>';
    count.appendChild(o);
  }
  if(waiting){
    if(open){
      const s = document.createElement('span');
      s.className = 'sep'; s.textContent = '·';
      count.appendChild(s);
    }
    const w = document.createElement('button');
    w.className = 'waitlink';
    w.innerHTML = waiting + '<span class="w"> waiting</span>';
    w.onclick = openPipe;
    count.appendChild(w);
  }
  if(needsAttention()){
    const a = document.createElement('button');
    a.className = 'alertdot';
    a.setAttribute('aria-label','Something needs your attention');
    a.title = storageFailed ? 'This device is out of storage'
            : (!loadClean ? 'Some stored data could not be read' : 'Sync needs a decision');
    a.innerHTML = '<i></i>';
    a.onclick = openSheet;
    count.appendChild(a);
  }
}

function needsAttention(){ return conflictPending || storageFailed || !loadClean; }
function renderAlerts(){ render(); }

/* ---------- wide: board of panels ---------- */
function renderWide(){
  const total = TABS.reduce((n,t) => n + openCount(t), 0);
  renderCount(total, totalWaiting());
  stage.innerHTML = '';
  const board = document.createElement('div');
  board.className = 'board';
  board.style.setProperty('--cols', Math.max(1, TABS.length));
  TABS.forEach(tab => {
    const col = document.createElement('div');
    col.className = 'col';

    const head = document.createElement('div');
    head.className = 'colhead';
    const h = document.createElement('h3'); h.textContent = tab;
    head.appendChild(h);
    const open = openCount(tab);
    if(open){ const n = document.createElement('span'); n.className='n'; n.textContent=open; head.appendChild(n); }
    const cm = document.createElement('button');
    cm.className = 'colmenu';
    cm.innerHTML = '&#8943;';
    cm.setAttribute('aria-label','Panel settings');
    cm.onclick = () => openTabSheet(false);
    head.appendChild(cm);

    const items = document.createElement('div');
    items.className = 'items';
    listInto(items, tab);

    const foot = document.createElement('div');
    foot.className = 'colfoot';
    const comp = document.createElement('div');
    comp.className = 'compose';
    comp.innerHTML = '<svg class="wedge" viewBox="0 0 6 14" aria-hidden="true"><path d="M0 0 L6 0 L3 14 Z" fill="#BBA37D"/></svg>';
    const inp = document.createElement('input');
    inp.type='text'; inp.placeholder='Add an item'; inp.autocomplete='off';
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); if(addTo(tab, inp.value)){ refocus = tab; render(); } }
    });
    comp.appendChild(inp); foot.appendChild(comp);
    col.append(head, items, foot);
    board.appendChild(col);
  });

  stage.appendChild(board);
}
let refocus = null;
/* the switch under the masthead: counts show what is open on each side */
function renderSides(){
  const open = side => ALL.filter(t => spaceOf(t) === side).reduce((n, t) => n + openCount(t), 0);
  document.getElementById('sideOwnN').textContent = open('own') || '';
  document.getElementById('sideFaN').textContent  = open('fa')  || '';
  document.querySelectorAll('#sides button').forEach(b => b.classList.toggle('on', b.dataset.side === SPACE));
}

/* a view change, not an edit: nothing is written to OneDrive */
function switchSide(to){
  if(!SIDES[to] || to === SPACE) return;
  try{ localStorage.setItem(KEY + '.tab.' + SPACE, active); }catch(e){}
  if(openItem){ openItem = null; closeDetail(); }
  if(pdet.classList.contains('up')){
    pdet.classList.remove('up'); openProj = null; openProjTab = null; projFromBoard = false;
  }
  SPACE = to;
  deriveTabs();
  let next = null;
  try{ next = localStorage.getItem(KEY + '.tab.' + SPACE); }catch(e){}
  active = TABS.includes(next) ? next : TABS[0];
  applySide();
  try{
    localStorage.setItem(SIDEKEY, SPACE);
    localStorage.setItem(KEY + '.tab', active);
    localStorage.setItem(KEY + '.tab.' + SPACE, active);
  }catch(e){}
  render();
  if(proj.classList.contains('up')) renderProjects();
  if(pipe.classList.contains('up')) renderPipe();
  scroller.scrollTop = 0;
}
document.querySelectorAll('#sides button').forEach(b => { b.onclick = () => switchSide(b.dataset.side); });

function render(){
  renderSides();
  if(WIDE.matches) renderWide(); else renderNarrow();
  if(refocus && WIDE.matches){
    const i = TABS.indexOf(refocus);
    const inp = stage.querySelectorAll('.colfoot input')[i];
    if(inp) inp.focus();
  }
  refocus = null;
  document.getElementById('pipeBadge').textContent = totalWaiting() || '';
  const lt = totalLT();
  document.getElementById('projBadge').textContent = lt || '';
  document.getElementById('projCount').textContent = lt || '';
  /* keep an open detail view in sync */
  if(openItem) renderDetail();
  if(openProj) renderProject();
  if(proj.classList.contains('up')) renderProjects();
}

/* ---------- narrow compose ---------- */
function add(){
  if(addTo(active, entry.value)){
    entry.value = '';
    addBtn.classList.remove('live');
    render();
    scroller.scrollTop = 0;
  }
}
addBtn.onclick = add;
entry.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } });
entry.addEventListener('input', () => addBtn.classList.toggle('live', entry.value.trim().length > 0));

if(WIDE.addEventListener) WIDE.addEventListener('change', render);
else WIDE.addListener(render);

/* ---------- detail view ---------- */
function autogrow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function openDetail(tab, item, fromPipe){
  openTab = tab; openItem = item;
  cameFromPipe = !!fromPipe;
  document.getElementById('backLabel').textContent = cameFromPipe ? 'Pipeline' : 'Panels';
  renderDetail();
  detail.classList.add('up');
  scrim.classList.add('up');
  dbody.scrollTop = 0;
}
function closeDetail(){
  detail.classList.remove('up');
  openTab = null; openItem = null;
  if(cameFromPipe){
    /* the pipeline is still standing underneath — fall back onto it */
    cameFromPipe = false;
    renderPipe();
  }else{
    scrim.classList.remove('up');
  }
  render();
}

function renderDetail(){
  if(!openItem) return;
  const item = openItem;
  dtabname.textContent = openTab;
  detail.classList.toggle('done-item', item.done);
  dbody.innerHTML = '';

  /* title row: checkbox + editable title */
  const title = document.createElement('div');
  title.className = 'dtitle';
  const box = document.createElement('button');
  box.className = 'box';
  box.onclick = () => {
    item.done = !item.done;
    if(item.done) setWait(item, false);
    save(); renderDetail(); render();
  };
  const tarea = document.createElement('textarea');
  tarea.className = 'dtitle-txt';
  tarea.rows = 1;
  tarea.value = item.t;
  tarea.setAttribute('enterkeyhint','done');
  tarea.addEventListener('input', () => { item.t = tarea.value; autogrow(tarea); save(); });

  /* waiting block — only while the item is actually waiting */
  if(item.wait && !item.done){
    const wlabel = document.createElement('div');
    wlabel.className = 'dlabel';
    const wl = document.createElement('span'); wl.textContent = 'Waiting on';
    const ag = document.createElement('span');
    ag.className = 'age' + (isStale(item) ? ' stale' : '');
    ag.textContent = ageText(item.since) === 'today' ? 'since today' : ageText(item.since);
    wlabel.append(wl, ag);
    dbody.appendChild(wlabel);

    const wbox = document.createElement('div');
    wbox.className = 'waitbox';
    const who = document.createElement('input');
    who.className = 'whoin';
    who.type = 'text';
    who.placeholder = 'Who or what you are waiting on';
    who.value = item.who;
    who.autocomplete = 'off';
    who.setAttribute('enterkeyhint','done');
    who.addEventListener('input', () => { item.who = who.value; save(); });
    who.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); who.blur(); } });
    wbox.appendChild(who);

    const mrow = document.createElement('div');
    mrow.className = 'microrow';

    const chase = document.createElement('button');
    chase.className = 'micro';
    chase.textContent = item.nudged
      ? 'Chased again today (last ' + ageText(item.nudged) + ' ago)'
      : 'Mark chased today';
    chase.onclick = () => { item.nudged = Date.now(); save(); renderDetail(); render(); };
    mrow.appendChild(chase);

    wbox.appendChild(mrow);
    dbody.appendChild(wbox);
  }

  /* notes */
  const nlabel = document.createElement('div');
  nlabel.className = 'dlabel';
  const nl = document.createElement('span'); nl.textContent = 'Notes';
  nlabel.appendChild(nl);
  dbody.appendChild(nlabel);
  const notes = document.createElement('textarea');
  notes.className = 'notes';
  notes.placeholder = 'Add details, context, links...';
  notes.value = item.notes;
  notes.addEventListener('input', () => { item.notes = notes.value; autogrow(notes); save(); });
  dbody.appendChild(notes);

  /* sub-items */
  const slabel = document.createElement('div');
  slabel.className = 'dlabel';
  const sl = document.createElement('span'); sl.textContent = 'Checklist';
  slabel.appendChild(sl);
  dbody.appendChild(slabel);

  item.subs.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'sub' + (s.done ? ' done' : '');
    const sb = document.createElement('button');
    sb.className = 'subbox';
    sb.onclick = () => { s.done = !s.done; save(); renderDetail(); };
    const st = document.createElement('div');
    st.className = 'sub-txt';
    st.textContent = s.t;
    const sd = document.createElement('button');
    sd.className = 'sub-del';
    sd.textContent = '×';
    sd.onclick = () => { item.subs.splice(idx,1); save(); renderDetail(); };
    row.append(sb, st, sd);
    dbody.appendChild(row);
  });

  /* add sub-item */
  const addRow = document.createElement('div');
  addRow.className = 'subadd';
  const plus = document.createElement('div'); plus.className = 'plus';
  const sinp = document.createElement('input');
  sinp.type = 'text';
  sinp.placeholder = 'Add a checklist item';
  sinp.autocomplete = 'off';
  sinp.setAttribute('enterkeyhint','done');
  sinp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const v = sinp.value.trim();
      if(v){ item.subs.push({t: v, done: false}); save(); renderDetail();
             const again = dbody.querySelector('.subadd input'); if(again) again.focus(); }
    }
  });
  addRow.append(plus, sinp);
  dbody.appendChild(addRow);

  /* item tools */
  const tools = document.createElement('div');
  tools.className = 'dtools';

  const waitBtn = document.createElement('button');
  waitBtn.textContent = item.wait ? 'Stop waiting — make active' : 'Mark as waiting on someone else';
  waitBtn.onclick = () => {
    setWait(item, !item.wait);
    save(); renderDetail(); render();
  };
  tools.appendChild(waitBtn);

  const ltBtn = document.createElement('button');
  ltBtn.textContent = 'Make this a long-term project';
  ltBtn.onclick = () => {
    makeLT(item);
    save();
    const tab = openTab, it = item;
    closeDetail();
    openProject(tab, it, false);
  };
  tools.appendChild(ltBtn);

  /* move to another panel */
  if(TABS.length > 1){
    const nextUp = TABS[(TABS.indexOf(openTab) + 1) % TABS.length];
    const moveBtn = document.createElement('button');
    moveBtn.textContent = 'Move to ' + nextUp;
    moveBtn.onclick = () => {
      if(!Array.isArray(data[openTab])){ closeDetail(); return; }
      const i = TABS.indexOf(openTab);
      const nextTab = TABS[(i + 1) % TABS.length];
      data[openTab] = data[openTab].filter(x => x !== item);
      data[nextTab].unshift(item);
      openTab = nextTab;
      save(); renderDetail(); render();
    };
    tools.appendChild(moveBtn);
  }

  const del = document.createElement('button');
  del.textContent = 'Delete this item';
  del.onclick = () => {
    if(!Array.isArray(data[openTab])){ closeDetail(); return; }
    data[openTab] = data[openTab].filter(x => x !== item);
    save(); closeDetail();
  };
  tools.appendChild(del);
  dbody.appendChild(tools);

  autogrow(tarea);
  autogrow(notes);
}

/* ---------- pipeline: everything you are waiting on ---------- */
const sortAgeBtn   = document.getElementById('sortAge');
const sortPanelBtn = document.getElementById('sortPanel');

function waitingEverywhere(){
  const out = [];
  TABS.forEach(tab => {
    (data[tab] || []).forEach(item => {
      if(item.wait && !item.done) out.push({tab, item});
    });
  });
  return out;
}

function openPipe(){
  closeSheet();
  renderPipe();
  pipe.classList.add('up');
  scrim.classList.add('up');
  pipebody.scrollTop = 0;
}
function closePipe(){
  pipe.classList.remove('up');
  scrim.classList.remove('up');
}

function renderPipe(){
  sortAgeBtn.classList.toggle('on', UI.pipeSort !== 'panel');
  sortPanelBtn.classList.toggle('on', UI.pipeSort === 'panel');

  const rows = waitingEverywhere();
  const stale = rows.filter(r => isStale(r.item)).length;
  const pc = document.getElementById('pipeCount');
  pc.textContent = rows.length
    ? rows.length + (stale ? ' · ' + stale + ' stale' : '')
    : '';

  pipebody.innerHTML = '';

  if(!rows.length){
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<div class="line"></div><p>Nothing is sitting with anyone else.</p>' +
                  '<span>Open an item to mark it waiting</span>';
    pipebody.appendChild(d);
    return;
  }

  if(UI.pipeSort === 'panel'){
    TABS.forEach(tab => {
      const inTab = rows.filter(r => r.tab === tab)
                        .sort((a,b) => (a.item.since || 0) - (b.item.since || 0));
      if(!inTab.length) return;
      const g = document.createElement('div');
      g.className = 'pgroup';
      const nm = document.createElement('span'); nm.textContent = tab;
      g.appendChild(nm);
      pipebody.appendChild(g);
      inTab.forEach(r => pipebody.appendChild(pipeRow(r.tab, r.item, false)));
    });
  }else{
    rows.sort((a,b) => (a.item.nudged || a.item.since || 0) - (b.item.nudged || b.item.since || 0));
    rows.forEach(r => pipebody.appendChild(pipeRow(r.tab, r.item, true)));
  }
}

function pipeRow(tab, item, showPanel){
  const row = document.createElement('div');
  row.className = 'prow';

  const top = document.createElement('div');
  top.className = 'ptop';
  if(showPanel){
    const p = document.createElement('span');
    p.className = 'ppanel';
    p.textContent = tab;
    top.appendChild(p);
  }
  const age = document.createElement('span');
  age.className = 'page' + (isStale(item) ? ' stale' : '');
  age.textContent = shortAge(item.since);
  top.appendChild(age);
  row.appendChild(top);

  const txt = document.createElement('div');
  txt.className = 'ptxt';
  txt.textContent = item.t;
  txt.onclick = () => openDetail(tab, item, true);
  row.appendChild(txt);

  const who = document.createElement('div');
  who.className = 'pwho';
  const bits = [];
  bits.push(item.who.trim()
    ? 'with ' + escapeHtml(item.who.trim())
    : '<em>no one named</em>');
  bits.push('since ' + ageText(item.since) + (ageText(item.since) === 'today' ? '' : ' ago'));
  if(item.nudged) bits.push('chased ' + ageText(item.nudged) + (ageText(item.nudged) === 'today' ? '' : ' ago'));
  who.innerHTML = bits.join(' &middot; ');
  row.appendChild(who);

  const acts = document.createElement('div');
  acts.className = 'pacts';

  const chase = document.createElement('button');
  chase.className = 'micro';
  chase.textContent = 'Chased';
  chase.onclick = () => { item.nudged = Date.now(); save(); renderPipe(); render(); };

  const back = document.createElement('button');
  back.className = 'micro';
  back.textContent = 'Unblock';
  back.onclick = () => { setWait(item, false); save(); renderPipe(); render(); };

  const done = document.createElement('button');
  done.className = 'micro';
  done.textContent = 'Done';
  done.onclick = () => { setWait(item, false); item.done = true; save(); renderPipe(); render(); };

  acts.append(chase, back, done);
  row.appendChild(acts);
  return row;
}

const proj      = document.getElementById('proj');

let openProj = null;
let openProjTab = null;
let projFromBoard = false;

function projectsEverywhere(){
  const live = [], closed = [];
  TABS.forEach(tab => {
    (data[tab] || []).forEach(item => {
      if(!item.lt) return;
      (item.done ? closed : live).push({tab, item});
    });
  });
  return {live, closed};
}

function openProjects(){
  closeSheet();
  renderProjects();
  proj.classList.add('up');
  scrim.classList.add('up');
  projbody.scrollTop = 0;
}
function closeProjects(){
  proj.classList.remove('up');
  scrim.classList.remove('up');
}

function renderProjects(){
  const {live, closed} = projectsEverywhere();
  document.getElementById('projHeadCount').textContent = live.length ? String(live.length) : '';
  projbody.innerHTML = '';

  if(!live.length && !closed.length){
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<div class="line"></div><p>No long-term projects yet.</p>' +
                  '<span>Start one below, or open any item and make it long term</span>';
    projbody.appendChild(d);
  }else{
    live.forEach(r => projbody.appendChild(projectCard(r.tab, r.item)));
    if(closed.length){
      const g = document.createElement('div');
      g.className = 'pgroup';
      const nm = document.createElement('span'); nm.textContent = 'Finished';
      g.appendChild(nm);
      projbody.appendChild(g);
      closed.forEach(r => projbody.appendChild(projectCard(r.tab, r.item)));
    }
  }

  /* start one straight from the board, on whichever panel is in front */
  const addWrap = document.createElement('div');
  addWrap.className = 'projadd';
  const comp = document.createElement('div');
  comp.className = 'compose';
  comp.innerHTML = '<svg class="wedge" viewBox="0 0 6 14" aria-hidden="true"><path d="M0 0 L6 0 L3 14 Z" fill="#BBA37D"/></svg>';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'Start a project on ' + active;
  inp.autocomplete = 'off';
  inp.setAttribute('enterkeyhint','done');
  inp.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const v = inp.value.trim();
    if(!v) return;
    const item = normalize({t: v});
    makeLT(item);
    data[active].unshift(item);
    save(); render(); renderProjects();
    openProject(active, item, true);
  });
  comp.appendChild(inp);
  addWrap.appendChild(comp);
  projbody.appendChild(addWrap);
}

function projectCard(tab, item){
  const card = document.createElement('div');
  card.className = 'pcard' + (item.done ? ' shut' : '');
  card.onclick = () => openProject(tab, item, true);

  const top = document.createElement('div');
  top.className = 'ptop';
  const p = document.createElement('span');
  p.className = 'ppanel';
  p.textContent = tab;
  top.appendChild(p);
  const st = stepStats(item);
  const fr = document.createElement('span');
  fr.className = 'page';
  fr.textContent = st.total ? st.done + '/' + st.total : 'no steps yet';
  top.appendChild(fr);
  card.appendChild(top);

  const txt = document.createElement('div');
  txt.className = 'ptxt';
  txt.textContent = item.t;
  card.appendChild(txt);

  if(!item.done){
    const nx = document.createElement('div');
    nx.className = 'pnext';
    const t = nextStep(item);
    if(t) nx.textContent = 'Next: ' + t;
    else nx.innerHTML = '<em>nothing queued</em>';
    card.appendChild(nx);
  }

  const bar = document.createElement('div');
  bar.className = 'pbar';
  const fill = document.createElement('i');
  fill.style.width = (st.total ? Math.round(100 * st.done / st.total) : 0) + '%';
  bar.appendChild(fill);
  card.appendChild(bar);

  return card;
}

function openProject(tab, item, fromBoard){

function closeProject(){

/* one row: a step, or a sub-step when parent is passed */
function stepRow(item, s, idx, parent, pidx){
  const row = document.createElement('div');
  row.className = 'step' + (parent ? ' kid' : '') + (s.done ? ' done' : '');

  const box = document.createElement('button');
  box.className = 'subbox';
  box.onclick = () => { s.done = !s.done; save(); renderProject(); render(); };

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'stin';
  inp.value = s.t;
  inp.placeholder = parent ? 'Sub-step' : 'Step';
  inp.autocomplete = 'off';
  inp.setAttribute('enterkeyhint','done');
  inp.dataset.step = parent ? (pidx + '.' + idx) : String(idx);
  inp.addEventListener('input', () => { s.t = inp.value; save(); });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
  inp.addEventListener('blur', () => {
    /* an empty line left behind is noise: drop it */
    if(s.t.trim()) return;
    if(parent) kidList(parent).splice(idx, 1);
    else stepList(item).splice(idx, 1);
    save(); renderProject(); render();
  });

  row.append(box, inp);

  if(!parent){
    const kids = kidList(s);
    const done = kids.filter(k => k.done).length;
    if(kids.length){
      const fr = document.createElement('span');
      fr.className = 'sfrac';
      fr.textContent = done + '/' + kids.length;
      row.appendChild(fr);
    }
    const add = document.createElement('button');
    add.className = 'sbtn';
    add.textContent = '+';
    add.setAttribute('aria-label','Add a sub-step');
    add.onclick = () => {
      kids.push({t: '', done: false});
      save();
      renderProject('[data-step="' + idx + '.' + (kids.length - 1) + '"]');
    };
    row.appendChild(add);
  }

  const del = document.createElement('button');
  del.className = 'sbtn';
  del.textContent = '\u00d7';
  del.setAttribute('aria-label','Remove');
  del.onclick = () => {
    if(parent) kidList(parent).splice(idx, 1);
    else stepList(item).splice(idx, 1);
    save(); renderProject(); render();
  };
  row.appendChild(del);

  return row;
}
