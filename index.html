const AUTHKEY  = KEY + '.ms';        // { rt, at, exp, who, folder }
const CTAGKEY  = KEY + '.ms.ctag';
const BDAYKEY  = KEY + '.ms.bday';
const PKCEKEY  = KEY + '.ms.pkce';
const STAMPKEY = KEY + '.ms.savedAt';   // when this device last wrote the live copy
const DIRTYKEY = KEY + '.dirty';

/* The write stamp is what stops a stale OneDrive copy from overwriting live
   data. A copy with no stamp counts as older than anything stamped. */
function localSavedAt(){ try{ return +localStorage.getItem(STAMPKEY) || 0; }catch(e){ return 0; } }
function setSavedAt(t){ try{ t ? localStorage.setItem(STAMPKEY, String(t)) : localStorage.removeItem(STAMPKEY); }catch(e){} }
function localItemCount(){
  try{ return ALL.reduce((n, t) => n + ((data[t] || []).length), 0); }catch(e){ return 0; }
}

function readAuth(){
  try{ return JSON.parse(localStorage.getItem(AUTHKEY) || 'null'); }catch(e){ return null; }
}
function writeAuth(a){
  try{ a ? localStorage.setItem(AUTHKEY, JSON.stringify(a)) : localStorage.removeItem(AUTHKEY); }catch(e){}
}
function saveTokens(j){
  const a = readAuth() || {};
  a.at  = j.access_token;
  a.exp = Date.now() + ((j.expires_in || 3600) * 1000) - 120000;
  if(j.refresh_token) a.rt = j.refresh_token;
  writeAuth(a);
}
function ctag(){ try{ return localStorage.getItem(CTAGKEY) || null; }catch(e){ return null; } }
function setCtag(v){
  try{ v ? localStorage.setItem(CTAGKEY, v) : localStorage.removeItem(CTAGKEY); }catch(e){}
}

const SYNC = {
  busy: false,
  get on(){ const a = readAuth(); return !!(a && a.rt); },
  get who(){ const a = readAuth(); return (a && a.who) || ''; },
  get folder(){ const a = readAuth(); return (a && a.folder) || ''; },
};

function setDirty(v){
  dirty = !!v;
  try{ v ? localStorage.setItem(DIRTYKEY, '1') : localStorage.removeItem(DIRTYKEY); }catch(e){}
}

const syncStatusEl = document.getElementById('syncStatus');
const syncMsgEl    = document.getElementById('syncMsg');
const syncSheet    = document.getElementById('syncSheet');

function newRev(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function setStatus(state, text){
  // state: 'off' | 'on' | 'busy' | 'err' | 'warn'
  syncStatusEl.className = 'synced' + (state === 'off' ? '' : ' ' + state);
  syncStatusEl.innerHTML = '<span class="led"></span>' + escapeHtml(text || '');
}

function reflectSyncButtons(){
  const on = SYNC.on;
  document.getElementById('syncNow').style.display      = on ? '' : 'none';
  document.getElementById('pushBtn').style.display      = on ? '' : 'none';
  document.getElementById('pullBtn').style.display      = on ? '' : 'none';
  document.getElementById('restoreCloud').style.display = on ? '' : 'none';
  document.getElementById('syncSetupSub').textContent = on
    ? (SYNC.who || 'Connected') : 'Keep a copy in OneDrive';
  if(on) setStatus('on', 'OneDrive connected'); else setStatus('off', 'Not backed up');
}

/* ---------- PKCE ---------- */
function b64url(buf){
  let s = '';
  const b = new Uint8Array(buf);
  for(let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randStr(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a.buffer);
}
async function challengeFor(verifier){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(d);
}
/* The registered redirect URI. index.html is stripped so a launch of
   /mene/index.html and a launch of /mene/ both land on the same one. */
function redirectUri(){
  return (location.origin + location.pathname).replace(/index\.html$/, '');
}

async function msToken(body){
  const res = await fetch('https://login.microsoftonline.com/' + MS.tenant + '/oauth2/v2.0/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(body).toString(),
  });
  let j = null;
  try{ j = await res.json(); }catch(e){}
  if(!res.ok || !j || !j.access_token) throw new Error((j && j.error) || ('HTTP ' + res.status));
  return j;
}

async function msSignIn(){
  const verifier = randStr(48);
  const state    = randStr(12);
  /* localStorage, not sessionStorage: an installed PWA can come back from the
     sign-in redirect in a fresh session and a lost verifier is a dead end.
     It is removed the moment the code is exchanged. */
  try{ localStorage.setItem(PKCEKEY, JSON.stringify({ verifier, state })); }catch(e){}
  const p = new URLSearchParams({
    client_id: MS.clientId,
    response_type: 'code',
    redirect_uri: redirectUri(),
    response_mode: 'query',
    scope: MS.scope,
    code_challenge: await challengeFor(verifier),
    code_challenge_method: 'S256',
    state: state,
  });
  location.href = 'https://login.microsoftonline.com/' + MS.tenant + '/oauth2/v2.0/authorize?' + p.toString();
}

/* Runs on every boot. Returns true when a sign-in has just completed. */
async function msHandleRedirect(){
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  const err  = q.get('error');
  if(!code && !err) return false;

  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(PKCEKEY) || 'null'); }catch(e){}
  try{ localStorage.removeItem(PKCEKEY); }catch(e){}
  history.replaceState(null, '', redirectUri());

  if(err){ setStatus('err', 'Sign-in was cancelled'); return false; }
  if(!saved || saved.state !== q.get('state')){ setStatus('err', 'Sign-in did not match'); return false; }

  try{
    const j = await msToken({
      client_id: MS.clientId,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: redirectUri(),
      code_verifier: saved.verifier,
      scope: MS.scope,
    });
    saveTokens(j);
    await msIdentify();
    return true;
  }catch(e){
    setStatus('err', 'Sign-in failed');
    return false;
  }
}

/* A valid access token, refreshed if needed. Null when signed out. */
async function msAccess(){
  const a = readAuth();
  if(!a || !a.rt) return null;
  if(a.at && a.exp > Date.now()) return a.at;
  try{
    const j = await msToken({
      client_id: MS.clientId,
      grant_type: 'refresh_token',
      refresh_token: a.rt,
      scope: MS.scope,
    });
    saveTokens(j);
    return j.access_token;
  }catch(e){
    /* invalid_grant means the refresh token is spent or revoked. Anything else
       is most likely the network, and the tokens are worth keeping. */
    if(String(e.message).indexOf('invalid_grant') === 0){ writeAuth(null); setCtag(null); }
    return null;
  }
}

async function gr(path, opts){
  const at = await msAccess();
  if(!at) throw new Error('signed-out');
  return fetch('https://graph.microsoft.com/v1.0' + path, {
    ...opts,
    cache: 'no-store',
    headers: { 'Authorization': 'Bearer ' + at, ...((opts && opts.headers) || {}) },
  });
}

/* Record who is signed in and which folder Graph actually gave us. The app
   folder takes its name from the registration, so if that is ever renamed the
   data moves and this is the only place it would show. */
async function msIdentify(){
  const a = readAuth(); if(!a) return;
  try{
    const me = await gr('/me?$select=displayName,userPrincipalName');
    if(me.ok){ const j = await me.json(); a.who = j.userPrincipalName || j.displayName || ''; }
    const root = await gr('/me/drive/special/approot');
    if(root.ok){ const j = await root.json(); a.folder = j.name || ''; }
    writeAuth(a);
  }catch(e){}
}

/* ---------- reading and writing the cloud copy ---------- */

/* tolerates the current wrapper, the v5 wrapper, and a bare panels object */
function parseCloud(text){
  const raw = JSON.parse(text);
  if(raw && raw.__ledger && raw.lists) return { lists: raw.lists, order: raw.order || null, savedAt: +raw.savedAt || 0, spaces: raw.spaces || null };
  return { lists: raw, order: null, savedAt: 0, spaces: null };
}

async function cloudPull(){
  if(!SYNC.on) return false;
  SYNC.busy = true; setStatus('busy', 'Reading OneDrive\u2026');
  try{
    const meta = await gr('/me/drive/special/approot:/' + MS.file);
    if(meta.status === 404){
      /* nothing up there yet: this device is the source, so seed it now
         rather than waiting for the next edit */
      setCtag(null);
      SYNC.busy = false;
      if(localItemCount()) return cloudPush(true);
      setStatus('on', 'No copy in OneDrive yet');
      return true;
    }
    if(!meta.ok) throw new Error('HTTP ' + meta.status);
    const m = await meta.json();

    const res = await gr('/me/drive/special/approot:/' + MS.file + ':/content');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const { lists, order, savedAt, spaces } = parseCloud(await res.text());
    setCtag(m.cTag || m.eTag || null);

    const cloudStamp = +savedAt || 0;
    const mine       = localSavedAt();
    const empty      = localItemCount() === 0;
    const hasCloud   = !!(lists && Object.keys(lists).length);

    /* Take the OneDrive copy only when it is provably newer, or when this
       device holds nothing to lose. Anything else and the device wins. */
    if(hasCloud && (empty || cloudStamp > mine)){
      adoptLists(lists, order, spaces);
      localStorage.setItem(KEY, JSON.stringify(data));
      localStorage.setItem(TABKEY, JSON.stringify(ALL));
      localStorage.setItem(SPACEKEY, JSON.stringify(SPACEMAP));
      if(openItem){ openItem = null; closeDetail(); }
      setSavedAt(cloudStamp);
      render();
      if(pipe.classList.contains('up')) renderPipe();
      SYNC.busy = false; setStatus('on', 'Up to date');
      return true;
    }

    SYNC.busy = false;
    /* this device is ahead of OneDrive: send it up rather than sit on it */
    if(!empty && mine > cloudStamp) return cloudPush(false);
    setStatus('on', 'Up to date');
    return true;
  }catch(e){
    SYNC.busy = false;
    setStatus('err', e.message === 'signed-out' ? 'Sign in again' : 'Could not read OneDrive');
    return false;
  }
}

/* `force` writes without the if-match guard: the deliberate "this device wins" */
async function cloudPush(force){
  if(!SYNC.on) return false;
  SYNC.busy = true; setStatus('busy', 'Saving\u2026');
  try{
    const payload = { __ledger: 1, v: 6, rev: newRev(), savedAt: Date.now(), order: ALL, spaces: SPACEMAP, lists: data };
    const body    = JSON.stringify(payload, null, 2);
    const headers = { 'Content-Type': 'application/json' };
    const ct = ctag();
    if(!force && ct) headers['if-match'] = ct;

    const res = await gr('/me/drive/special/approot:/' + MS.file + ':/content', {
      method: 'PUT', headers: headers, body: body,
    });
    if(res.status === 412 || res.status === 409){
      /* the file changed since this device last read it. With one device this
         should never fire; if it does, say so rather than overwrite. */
      conflictPending = true;
      SYNC.busy = false; setStatus('warn', 'OneDrive copy changed \u2014 open menu');
      render();
      return false;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const m = await res.json();
    setCtag(m.cTag || m.eTag || null);
    setSavedAt(payload.savedAt);
    setDirty(false);
    conflictPending = false;
    SYNC.busy = false; setStatus('on', 'Saved to OneDrive');
    dailyBackup(body);
    return true;
  }catch(e){
    SYNC.busy = false;
    setStatus('err', e.message === 'signed-out' ? 'Sign in again' : 'Could not save to OneDrive');
    return false;
  }
}

/* One dated copy per day, first write of that day, never pruned. This is the
   one that answers "I deleted something last Tuesday". */
async function dailyBackup(body){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const day = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  let last = '';
  try{ last = localStorage.getItem(BDAYKEY) || ''; }catch(e){}
  if(last === day) return;
  const path = '/me/drive/special/approot:/backups/ledger-' + day + '.json:/content';
  try{
    let res = await gr(path, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: body });
    if(res.status === 404){
      /* the folder is created on first use; some tenants will not make it
         implicitly, so ask for it and write once more */
      await gr('/me/drive/special/approot/children', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'backups', folder: {}, '@microsoft.graph.conflictBehavior': 'replace' }),
      });
      res = await gr(path, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: body });
    }
    if(res.ok){ try{ localStorage.setItem(BDAYKEY, day); }catch(e){} }
  }catch(e){}
}

/* ---------- restore from OneDrive ---------- */
const cloudSheet = document.getElementById('cloudSheet');
const cloudList  = document.getElementById('cloudList');
const cloudMsg   = document.getElementById('cloudMsg');
let armedRestore = null;

function closeCloudSheet(){ cloudSheet.classList.remove('up'); armedRestore = null; }

async function openCloudSheet(){
  armedRestore = null;
  cloudList.innerHTML = '';
  cloudMsg.className = 'syncmsg';
  cloudMsg.textContent = 'Reading OneDrive\u2026';
  cloudSheet.classList.add('up'); scrim.classList.add('up');
  const files = [];
  try{
    const live = await gr('/me/drive/special/approot:/' + MS.file + '?$select=name,size,lastModifiedDateTime');
    if(live.ok){ const j = await live.json(); files.push({ path: MS.file, label: 'Current copy', when: j.lastModifiedDateTime, size: j.size }); }
    const kids = await gr('/me/drive/special/approot:/backups:/children?$top=200&$select=name,size,lastModifiedDateTime');
    if(kids.ok){
      const j = await kids.json();
      (j.value || [])
        .filter(f => /^ledger-\d{4}-\d{2}-\d{2}\.json$/.test(f.name))
        .sort((a, b) => a.name < b.name ? 1 : -1)
        .forEach(f => files.push({ path: 'backups/' + f.name, label: f.name.slice(7, 17), when: f.lastModifiedDateTime, size: f.size }));
    }
  }catch(e){
    cloudMsg.classList.add('err');
    cloudMsg.textContent = e.message === 'signed-out' ? 'Sign in again first.' : 'Could not reach OneDrive.';
    return;
  }
  if(!files.length){
    cloudMsg.textContent = 'Nothing in OneDrive yet.';
    return;
  }
  cloudMsg.textContent = 'Tap a copy, then tap it again to confirm. Restoring replaces everything on this device.';
  files.forEach(f => {
    const b = document.createElement('button');
    b.className = 'act';
    const kb = f.size ? Math.max(1, Math.round(f.size / 1024)) + ' KB' : '';
    b.innerHTML = escapeHtml(f.label) + '<small>' + escapeHtml([shortWhen(f.when), kb].filter(Boolean).join(' \u00b7 ')) + '</small>';
    b.onclick = () => {
      if(armedRestore !== f.path){
        armedRestore = f.path;
        [...cloudList.children].forEach(c => c.classList.remove('warn'));
        b.classList.add('warn');
        b.querySelector('small').textContent = 'Tap again to replace everything here';
        return;
      }
      restoreFromCloud(f.path);
    };
    cloudList.appendChild(b);
  });
}

function shortWhen(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function restoreFromCloud(path){
  cloudMsg.className = 'syncmsg';
  cloudMsg.textContent = 'Restoring\u2026';
  try{
    const res = await gr('/me/drive/special/approot:/' + path + ':/content');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const { lists, order, spaces } = parseCloud(await res.text());
    if(!lists || !Object.keys(lists).length) throw new Error('empty');
    if(openItem){ openItem = null; closeDetail(); }
    if(!adoptLists(lists, order, spaces)) throw new Error('empty');
    _save();
    render();
    closeCloudSheet(); closeSheet();
    setStatus('on', 'Restored from OneDrive');
    /* the restored state is now the truth on this device; send it up so the
       live copy and the device agree again */
    setDirty(true);
    cloudPush(true);
  }catch(e){
    cloudMsg.className = 'syncmsg err';
    cloudMsg.textContent = e.message === 'empty' ? "That file isn't a Ledger backup." : 'Could not restore that copy.';
    armedRestore = null;
  }
}

let conflictPending = false;
/* true when this device has an edit that has not reached OneDrive. Kept in
   storage so a reload, a crash or a backgrounded PWA cannot forget it. */
let dirty = (function(){ try{ return !!localStorage.getItem(DIRTYKEY); }catch(e){ return false; } })();

/* debounced auto-push after edits */
let pushTimer = null;
function scheduleSync(){
  if(!SYNC.on) return;
  setDirty(true);
  setStatus('busy', 'Saving\u2026');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { cloudPush(false); }, 2000);
}

/* wrap save() so every change schedules a push */
const _save = save;
save = function(){ _save(); scheduleSync(); };

/* ---------- backup sheet ---------- */
function openSheet(){
  const total = ALL.reduce((n,t) => n + data[t].length, 0);
  stamp.textContent = total + (total === 1 ? ' item stored' : ' items stored');
  const sm = document.getElementById('storeMsg');
  sm.className = 'syncmsg' + (storageFailed || !loadClean ? ' err' : '');
  sm.textContent = storageFailed
    ? 'This device could not save. Storage is full — save a backup, then clear space.'
    : (!loadClean
        ? 'Part of what was stored here could not be read. The original was left untouched and copied aside under ledger.v1.rescue.'
        : '');
  sm.style.display = sm.textContent ? '' : 'none';
  document.getElementById('pipeBadge').textContent = totalWaiting() || '';
  reflectSyncButtons();
  if(SYNC.on && conflictPending){
    setStatus('warn', 'Cloud changed elsewhere');
    document.getElementById('syncNowSub').textContent =
      'This device and OneDrive both changed. Pull to take the OneDrive copy, or Push to keep this device.';
  }else{
    document.getElementById('syncNowSub').textContent = 'Save this device to OneDrive';
  }
  sheet.classList.add('up'); scrim.classList.add('up');
}
function closeSheet(){ sheet.classList.remove('up'); scrim.classList.remove('up'); }
function openSyncSheet(){
  syncMsgEl.className = 'syncmsg';
  syncMsgEl.textContent = SYNC.on
    ? ('Signed in as ' + SYNC.who + '. Saved to OneDrive / Apps / ' + (SYNC.folder || 'Ledger') + '.'
       + (SYNC.folder && SYNC.folder !== 'Ledger' ? ' That folder is not called Ledger, so the app registration was renamed.' : ''))
    : 'Sign in once and this device keeps a copy of the ledger in your own OneDrive app folder. Nothing else can see it.';
  document.getElementById('syncSave').style.display   = SYNC.on ? 'none' : '';
  document.getElementById('syncForget').style.display = SYNC.on ? '' : 'none';
  syncSheet.classList.add('up'); scrim.classList.add('up');
}
function closeSyncSheet(){ syncSheet.classList.remove('up'); }

/* ---------- manage panels ---------- */
const tabSheet  = document.getElementById('tabSheet');
const tabListEl = document.getElementById('tabList');
const tabMsgEl  = document.getElementById('tabMsg');
const newTabIn  = document.getElementById('newTabIn');

function tabMsg(text, kind){
  tabMsgEl.className = 'syncmsg' + (kind ? ' ' + kind : '');
  tabMsgEl.textContent = text || '';
}

function renderTabManager(){
  tabListEl.innerHTML = '';
  TABS.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'tabrow';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = name;
    inp.setAttribute('aria-label', 'Panel name');
    inp.addEventListener('change', () => renameTab(i, inp.value));
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });

    const cnt = document.createElement('span');
    cnt.className = 'cnt';
    const n = data[name] ? data[name].length : 0;
    const w = waitCount(name);
    cnt.textContent = (n === 1 ? '1 item' : n + ' items') + (w ? ' · ' + w + ' waiting' : '');

    const up = document.createElement('button');
    up.className = 'tabbtn'; up.textContent = '↑';
    up.setAttribute('aria-label','Move up');
    up.disabled = (i === 0);
    up.onclick = () => moveTab(i, -1);

    const dn = document.createElement('button');
    dn.className = 'tabbtn'; dn.textContent = '↓';
    dn.setAttribute('aria-label','Move down');
    dn.disabled = (i === TABS.length - 1);
    dn.onclick = () => moveTab(i, 1);

    const rm = document.createElement('button');
    rm.className = 'tabbtn rm'; rm.textContent = '×';
    rm.setAttribute('aria-label','Remove panel');
    rm.disabled = (TABS.length <= 1);
    rm.onclick = () => removeTab(i);

    const mv = document.createElement('button');
    const other = SPACE === 'fa' ? 'own' : 'fa';
    mv.className = 'tabbtn mv';
    mv.textContent = other === 'fa' ? '\u2192 FA' : '\u2192 Own';
    mv.setAttribute('aria-label', 'Move to ' + SIDES[other]);
    mv.disabled = (TABS.length <= 1);
    mv.onclick = () => moveSide(i);

    row.append(inp, cnt, up, dn, mv, rm);
    tabListEl.appendChild(row);
  });
}

function renameTab(i, raw){
  const next = (raw || '').trim();
  const prev = TABS[i];
  if(!next){ tabMsg('A panel needs a name.', 'err'); renderTabManager(); return; }
  if(next === prev){ tabMsg(''); return; }
  if(ALL.some(t => t !== prev && t.toLowerCase() === next.toLowerCase())){
    tabMsg('There is already a panel with that name.', 'err');
    renderTabManager(); return;
  }
  /* carry the items across to the new key, preserving the order of panels */
  const items = data[prev] || [];
  delete data[prev];
  data[next] = items;
  TABS[i] = next;
  if(active === prev) active = next;
  if(openTab === prev) openTab = next;
  if(UI.waitOpen[prev] !== undefined){ UI.waitOpen[next] = UI.waitOpen[prev]; delete UI.waitOpen[prev]; }
  save(); renderTabManager(); render();
  tabMsg('Renamed. Items kept.', 'ok');
}

function moveTab(i, dir){
  const j = i + dir;
  if(j < 0 || j >= TABS.length) return;
  const tmp = TABS[i]; TABS[i] = TABS[j]; TABS[j] = tmp;
  save(); renderTabManager(); render();
  tabMsg('');
}

function moveSide(i){
  const name = TABS[i];
  const to = SPACE === 'fa' ? 'own' : 'fa';
  if(TABS.length <= 1){ tabMsg('Each side keeps at least one panel.', 'err'); return; }
  SPACEMAP[name] = to;
  TABS.splice(i, 1);
  if(active === name) active = TABS[0];
  if(openTab === name){ openTab = null; openItem = null; closeDetail(); }
  save(); renderTabManager(); render();
  tabMsg('Moved "' + name + '" to ' + SIDES[to] + '. Items kept.', 'ok');
}

function removeTab(i){
  const name = TABS[i];
  const n = (data[name] || []).length;
  if(TABS.length <= 1){ tabMsg('You need at least one panel.', 'err'); return; }
  const msg = n
    ? 'Delete "' + name + '" and its ' + n + (n === 1 ? ' item?' : ' items?') +
      '\n\nThis cannot be undone. Save a backup first if you are unsure.'
    : 'Delete the empty panel "' + name + '"?';
  if(!confirm(msg)) return;
  TABS.splice(i, 1);
  delete data[name];
  delete UI.waitOpen[name];
  if(active === name) active = TABS[0];
  if(openTab === name){ openTab = null; openItem = null; closeDetail(); }
  save(); renderTabManager(); render();
  tabMsg('Removed "' + name + '".', 'ok');
}

function addTab(raw){
  const name = (raw || '').trim();
  if(!name){ return false; }
  if(ALL.some(t => t.toLowerCase() === name.toLowerCase())){
    tabMsg('There is already a panel with that name.', 'err');
    return false;
  }
  TABS.push(name);
  if(!Array.isArray(data[name])) data[name] = [];
  save(); renderTabManager(); render();
  tabMsg('Added "' + name + '".', 'ok');
  return true;
}

function openTabSheet(focusNew){
  tabMsg('');
  const h = tabSheet.querySelector('h2');
  if(h) h.textContent = 'Panels \u00b7 ' + SIDES[SPACE];
  renderTabManager();
  newTabIn.value = '';
  closeSheet();
  tabSheet.classList.add('up'); scrim.classList.add('up');
  if(focusNew) setTimeout(() => newTabIn.focus(), 340);
}
function closeTabSheet(){ tabSheet.classList.remove('up'); scrim.classList.remove('up'); }

newTabIn.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(addTab(newTabIn.value)) newTabIn.value = '';
  }
});
document.getElementById('manageTabs').onclick = () => openTabSheet(false);
document.getElementById('tabBack').onclick = closeTabSheet;

document.getElementById('menu').onclick = openSheet;
scrim.onclick = () => {
  if(openItem){ closeDetail(); return; }
  if(pipe.classList.contains('up')){ closePipe(); return; }
  closeSheet(); closeSyncSheet(); closeTabSheet();
};
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(openItem){ closeDetail(); return; }
  if(pipe.classList.contains('up')){ closePipe(); return; }
  closeSheet(); closeSyncSheet(); closeTabSheet();
});

/* cloud buttons */
document.getElementById('syncSetup').onclick = openSyncSheet;
document.getElementById('syncBack').onclick  = closeSyncSheet;
document.getElementById('restoreCloud').onclick = openCloudSheet;
document.getElementById('cloudBack').onclick    = closeCloudSheet;

document.getElementById('syncNow').onclick = async () => {
  const ok = await cloudPush(false);
  if(ok) render();
};
document.getElementById('pushBtn').onclick = async () => {
  // explicit push is a deliberate "this device wins" - write past the guard
  const ok = await cloudPush(true);
  if(ok){ conflictPending = false; render(); }
};
document.getElementById('pullBtn').onclick = async () => {
  const ok = await cloudPull();
  if(ok){ conflictPending = false; setDirty(false); render(); }
};

document.getElementById('syncSave').onclick = async () => {
  syncMsgEl.className = 'syncmsg';
  syncMsgEl.textContent = 'Opening Microsoft sign-in\u2026';
  try{ await msSignIn(); }
  catch(e){
    syncMsgEl.className = 'syncmsg err';
    syncMsgEl.textContent = 'Could not start sign-in.';
  }
};

document.getElementById('syncForget').onclick = () => {
  writeAuth(null);
  setCtag(null);
  reflectSyncButtons();
  syncMsgEl.className = 'syncmsg';
  syncMsgEl.textContent = 'Signed out on this device. Your OneDrive copy is untouched.';
  document.getElementById('syncSave').style.display = '';
};

document.getElementById('exp').onclick = () => {
  const payload = { __ledger: 1, v: 6, order: ALL, spaces: SPACEMAP, lists: data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = 'ledger-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeSheet();
};
document.getElementById('imp').onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      /* accept the new wrapper, the older {order, lists} wrapper, and the
         original flat file that was just the panels object */
      const lists  = (parsed && parsed.__ledger && parsed.lists) ? parsed.lists : parsed;
      const order  = (parsed && parsed.order)  ? parsed.order  : null;
      const spaces = (parsed && parsed.spaces) ? parsed.spaces : null;
      if(!lists || typeof lists !== 'object') throw new Error('shape');
      if(openItem){ openItem = null; closeDetail(); }
      if(!adoptLists(lists, order, spaces)) throw new Error('empty');
      save(); render(); closeSheet();
    }catch(e){
      stamp.textContent = "That file isn't a Ledger backup";
    }
  };
  r.readAsText(f);
  file.value = '';
};

/* Write the migrated shape back so the first launch of a new version leaves
   storage in the current format even before an edit — but only when every
   byte in storage was understood. If anything failed to read, the original
   is left exactly as it was (and copied to ledger.v1.rescue). */
if(loadClean) _save();

render();
reflectSyncButtons();

/* Finish a sign-in if we have just come back from one, then reconcile with
   OneDrive: an edit this device never managed to push outranks the cloud copy,
   so send it up instead of pulling straight over the top of it. */
(async () => {
  const justSignedIn = await msHandleRedirect();
  reflectSyncButtons();
  if(!SYNC.on) return;
  if(justSignedIn){
    /* first sign-in on a wiped browser: take whatever is up there. On a device
       that already holds the ledger, dirty decides and nothing is lost. */
    if(dirty) await cloudPush(false); else await cloudPull();
    openSyncSheet();
  }else{
    if(dirty) cloudPush(false); else cloudPull();
  }
})();

document.addEventListener('visibilitychange', () => {
  if(!SYNC.on || SYNC.busy) return;
  if(document.visibilityState === 'hidden'){
    /* leaving the app is the last safe moment to save an edit still on the
       debounce */
    if(dirty){ clearTimeout(pushTimer); cloudPush(false); }
    return;
  }
  if(dirty) cloudPush(false); else cloudPull();
});

/* ---------- updates ---------- */
let swReg = null;
const updSub = document.getElementById('updSub');
function updMsg(t){ updSub.textContent = t; }
updMsg('Running ' + APP_VERSION);

document.getElementById('updBtn').onclick = async () => {
  updMsg('Checking\u2026');
  let latest = null;
  try{
    const res = await fetch('./index.html?ts=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('http');
    const txt = await res.text();
    const m = txt.match(/const APP_VERSION = '([^']+)'/);
    latest = m ? m[1] : null;
  }catch(e){
    updMsg('Could not check. No connection?');
    return;
  }
  if(!latest){ updMsg('Could not read the published version.'); return; }
  if(latest === APP_VERSION){ updMsg('Running ' + APP_VERSION + ', already the latest.'); return; }

  updMsg(latest + ' is out. Updating\u2026');
  /* the reload is scheduled first so a slow or stalled service worker can
     never leave the update half-applied */
  setTimeout(() => location.reload(), 1200);
  try{
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if(swReg){
      swReg.update();
      if(swReg.waiting) swReg.waiting.postMessage('skip-waiting');
    }
  }catch(e){}
};

/* ---------- offline + durable storage ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(r => { swReg = r; })
      .catch(() => {});
  });
}
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(ok => { if(!ok) navigator.storage.persist(); }).catch(() => {});
}
</script>
